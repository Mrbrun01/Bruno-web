/* =========================================================
   TOKENS
   Claro por defecto · oscuro (auto o manual) · modo república
   ========================================================= */
:root {
  --paper: #F6F7FC;
  --grid: rgba(52, 86, 214, .085);
  --margin: rgba(210, 58, 48, .45);
  --surface: #FFFFFF;
  --surface-2: #EEF0F8;
  --line: #DCE0EE;

  --ink: #171C33;

  --hi: #FFD426;

html[data-style="oceano"] {

/* =========================================================
   BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.5 var(--font-ui);
  transition: background-color .25s;
}
h1, h2, h3, p { margin-top: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
[hidden] { display: none !important; }
::selection { background: var(--hi); color: var(--hi-ink); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-3); }
.read { font-family: var(--font-read); }
.num { font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Colores de sede compartidos por Parchís y UNO */
:root { --p0: #d19a1e; --p1: #4f7bc7; --p2: #c4453b; --p3: #4f9d3a; }
html[data-style="board"] { --p0: #d19a1e; --p1: #0f766e; --p2: #c4453b; --p3: #4f9d3a; }
html[data-style="fiz"] { --p0: #9d0a17; --p1: #7d1c58; --p2: #c60b1e; --p3: #13774A; }

/* =========================================================
   ESTRUCTURA: barra lateral (el margen del cuaderno) + contenido
   ========================================================= */
.shell { display: grid; grid-template-columns: var(--side-w, 268px) minmax(0, 1fr); min-height: 100vh; }

.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
  width: var(--side-w, 268px);
  display: flex; flex-direction: column;
  padding: 20px 14px 14px;
  background: var(--paper);
  border-right: 2px solid var(--margin);
}
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 10px 16px; color: var(--ink); text-decoration: none; }
.brand-mark {
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  border-radius: 10px; background: var(--hi); color: var(--hi-ink);
  font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em;
}
.brand-name { display: block; font-size: 1.3rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.brand-sub { display: block; margin-top: 3px; font-size: .8rem; font-weight: 500; color: var(--ink-3); }

.nav { flex: 1; }
.nav-group { margin: 0 0 4px; }
.nav-group h2 { margin: 16px 12px 6px; font-size: .82rem; font-weight: 600; color: var(--ink-3); }
.nav-group:first-child h2 { margin-top: 4px; }
.nav-link {
  display: flex; align-items: center; gap: 11px;
  min-height: 40px; padding: 7px 12px; margin: 1px 0;
  border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500;
}
.nav-link:hover { background: var(--surface-2); color: var(--ink); }
.nav-link[aria-current="page"] { background: var(--hi); color: var(--hi-ink); font-weight: 700; }
.nav-link .i { font-size: 1.1rem; }

.side-foot { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 12px 6px 0; border-top: 1px solid var(--line); font-size: .8rem; color: var(--ink-3); }
.side-foot p { flex: 1; margin: 0; line-height: 1.35; }

/* Modos de la barra lateral: fija (por defecto), contraída o contraída con hover */
@media (min-width: 881px) {
  body[data-nav="compact"] .shell, body[data-nav="hover"] .shell { --side-w: 72px; }
  body[data-nav="compact"] .brand,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .brand { justify-content: center; padding-left: 0; padding-right: 0; gap: 0; }
  body[data-nav="compact"] .brand-name, body[data-nav="compact"] .brand-sub,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .brand-name,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .brand-sub { display: none; }
  body[data-nav="compact"] .nav-group h2,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .nav-group h2 { display: none; }
  body[data-nav="compact"] .nav-link,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .nav-link { justify-content: center; padding-left: 7px; padding-right: 7px; gap: 0; }
  body[data-nav="compact"] .nav-link span,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .nav-link span { display: none; }
  body[data-nav="compact"] .side-foot,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .side-foot { justify-content: center; }
  body[data-nav="compact"] .side-foot p,
  body[data-nav="hover"] .side:not(:hover):not(:focus-within) .side-foot p { display: none; }

  body[data-nav="hover"] .side:hover, body[data-nav="hover"] .side:focus-within {
    width: 268px; z-index: 45; box-shadow: 8px 0 30px rgba(10, 14, 30, .22);
  }
}
/* «CLICK» camuflado con el fondo, como en la página original */

.topbar { display: none; }
.scrim { display: none; }

.main { min-width: 0; padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 48px) 72px; }
.view { max-width: 1100px; margin: 0 auto; }
.page-head { margin-bottom: 26px; }
.page-head h1 { margin: 0 0 6px; font-size: clamp(1.9rem, 1.35rem + 2vw, 2.8rem); font-weight: 750; letter-spacing: -.035em; line-height: 1.08; }
.page-head h1:focus { outline: none; }
.page-head p { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 1.05rem; }

@media (max-width: 880px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 30;
    padding: 8px 12px; background: var(--paper); border-bottom: 2px solid var(--margin);
  }
  .topbar .brand { padding: 0; flex: 1; }
  .topbar .brand-mark { width: 32px; height: 32px; font-size: 1.1rem; }
  .topbar .brand-name { font-size: 1.15rem; }
  .side {
    position: fixed; inset: 0 auto 0 0; z-index: 40; height: 100%;
    width: min(300px, 86vw);
    visibility: hidden; transform: translateX(-102%);
    transition: transform .2s ease, visibility 0s .2s;
    box-shadow: 8px 0 30px rgba(10, 14, 30, .3);
  }
  body.nav-open .side { visibility: visible; transform: none; transition-delay: 0s; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(10, 14, 30, .5); }
  .side .brand { display: none; }
}

/* =========================================================
   COMPONENTES
   ========================================================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px;
  border: 1px solid var(--line-2); border-radius: 10px;
  background: var(--surface); color: var(--ink);
  font-weight: 600; text-decoration: none; line-height: 1.1;
  transition: background-color .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { background: var(--hi); filter: brightness(.94); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { color: var(--red); }
.btn.danger:hover:not(:disabled) { border-color: var(--red); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: .9rem; }
.btn.lg { min-height: 48px; padding: 0 22px; font-size: 1.05rem; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.armed { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: none;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--ink-2);
}
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }
.icon-btn[aria-pressed="true"] { background: var(--hi); color: var(--hi-ink); }
.icon-btn .i { font-size: 1.15rem; }

.input, .select, .textarea {
  width: 100%; min-height: 42px; padding: 8px 12px;
  border: 1px solid var(--line-2); border-radius: 10px;
  background: var(--surface); color: var(--ink);
}
.textarea { resize: vertical; line-height: 1.5; }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus { outline: 3px solid color-mix(in srgb, var(--blue) 40%, transparent); outline-offset: 0; border-color: var(--blue); }
.select { padding-right: 10px; cursor: pointer; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; font-weight: 600; color: var(--ink-2); min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card > h2, .card > h3 { margin-top: 0; }

/* Pestañas segmentadas */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.seg button {
  min-height: 36px; padding: 0 14px; border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-2); font-weight: 600;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: inset 0 -3px 0 var(--hi), 0 1px 2px rgba(0, 0, 0, .08);
}

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); font-size: .85rem; font-weight: 600; }

.tag-hi { background: var(--hi); color: var(--hi-ink); border-color: transparent; }

/* Ventanas */
dialog.dlg {
  width: min(560px, calc(100% - 32px)); max-height: min(86vh, 760px); padding: 0;
  border: 1px solid var(--line-2); border-radius: 18px;
  background: var(--surface); color: var(--ink);
  box-shadow: 0 30px 70px rgba(10, 14, 30, .4);
}
dialog.dlg[open] { display: flex; flex-direction: column; }
dialog.dlg::backdrop { background: rgba(10, 14, 30, .55); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px 22px; }
.dlg-head h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.01em; }
.dlg-body { padding: 0 22px 20px; overflow-y: auto; }
.dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 22px 18px; }

/* Aviso */
.toast {
  position: fixed; left: 50%; bottom: 22px; z-index: 100;
  display: flex; align-items: center; gap: 16px;
  max-width: calc(100% - 24px); padding: 11px 14px 11px 18px;
  border-radius: 12px; background: var(--ink); color: var(--paper);
  box-shadow: var(--shadow);
  visibility: hidden; opacity: 0; transform: translate(-50%, 10px);
  transition: opacity .18s, transform .18s, visibility 0s .18s;
}
.toast.show { visibility: visible; opacity: 1; transform: translate(-50%, 0); transition-delay: 0s; }
.toast button { padding: 4px 6px; margin: -4px -6px -4px 0; border: 0; border-radius: 6px; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; }

.empty { padding: 36px 16px; text-align: center; color: var(--ink-2); }
.empty h2, .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 1.2rem; }
.empty p { margin: 0 auto 14px; max-width: 40ch; }

.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0 0 16px; padding: 0; list-style: none; }
.stats li { display: flex; align-items: baseline; gap: 7px; color: var(--ink-3); font-size: .9rem; }
.stats b { font-size: 1.35rem; font-weight: 750; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.progress { height: 8px; margin: 0 0 18px; overflow: hidden; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; width: 0; background: var(--hi); border-radius: 99px; transition: width .25s; }

.kbd { display: inline-block; min-width: 1.6em; padding: 0 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 6px; background: var(--surface); text-align: center; font-size: .82em; font-weight: 600; }

/* PERSONALIZACIÓN */
.ajustes-card { max-width: 640px; margin-bottom: 18px; }
.ajustes-card h2 { margin: 0 0 4px; font-size: 1.15rem; }
.ajustes-card > .muted { margin: 0 0 14px; }
.ajustes-name { max-width: 320px; }
.ajustes-name .input { font-size: 1.05rem; }

/* Tarjetas de selección de estilo, en Personalización */
.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.style-card {
  display: flex; flex-direction: column; gap: 8px; padding: 14px; text-align: left;
  border: 2px solid var(--line-2); border-radius: 14px; background: var(--surface); color: var(--ink);
}
.style-card:hover { border-color: var(--ink-3); }
.style-card[aria-checked="true"] { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
.style-swatch { display: flex; align-items: flex-end; gap: 4px; padding: 6px; height: 44px; border-radius: 9px; border: 1px solid rgba(0, 0, 0, .1); }
.style-swatch span { flex: 1; height: 60%; border-radius: 5px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .08); }
.style-swatch span:last-child { height: 85%; }
.style-name { font-weight: 700; }
.style-desc { font-size: .85rem; color: var(--ink-2); line-height: 1.35; }

/* =========================================================
   INICIO
   ========================================================= */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 36px; align-items: center; margin-bottom: 36px; }
.hero-date { margin: 0 0 8px; color: var(--ink-2); font-weight: 600; }
.hero-title { margin: 0 0 24px; font-size: clamp(2.3rem, 1.2rem + 3.8vw, 4rem); font-weight: 780; letter-spacing: -.04em; line-height: 1.02; }
.hero-title:focus { outline: none; }

/* La hora vive en una nota adhesiva: el subrayador del cuaderno */
.clock-note {
  padding: 22px 30px 20px; border-radius: 8px;
  background: var(--hi); color: var(--hi-ink);
  transform: rotate(1.6deg);
  box-shadow: 0 2px 3px rgba(23, 28, 51, .12), 0 18px 34px -14px rgba(23, 28, 51, .4);
}
.clock-row { display: flex; align-items: baseline; gap: 10px; }
.clock-time { font-size: clamp(3.6rem, 2rem + 5.4vw, 6.4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.clock-sec { font-size: 1.7rem; font-weight: 700; opacity: .65; }
.dg { display: inline-block; width: .62em; text-align: center; }
.cn { display: inline-block; width: .32em; text-align: center; }
.clock-sec .dg { width: .64em; }

.search { display: flex; flex-direction: column; gap: 12px; max-width: 660px; }
.search-row { display: flex; gap: 8px; }
.search-input { flex: 1; min-height: 50px; font-size: 1.05rem; border-radius: 12px; }
.search .btn { min-height: 50px; border-radius: 12px; }
.search-engines { align-self: flex-start; padding: 3px; }
.search-engines button { min-height: 32px; padding: 0 11px; font-size: .88rem; }

.today { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 44px; }
.today-card { padding: 18px 20px; cursor: pointer; transition: border-color .12s, transform .12s; }
.today-card:hover { border-color: var(--ink); transform: translateY(-2px); }
.today-card:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.today-head h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.01em; }
.today-link { font-size: .88rem; font-weight: 600; color: var(--blue); }
.mini-list { display: grid; gap: 9px; margin: 0; padding: 0; list-style: none; }
.mini-list li { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mini-list li > span:not(.chip) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list time { font-weight: 700; min-width: 3.2em; }
.mini-list .past { color: var(--ink-3); }
.mini-list .dot { width: 11px; height: 11px; flex: none; border-radius: 50%; }
.today-card > p { margin: 0; }

.block { margin-bottom: 44px; }
.block-title { margin: 0 0 4px; font-size: 1.6rem; font-weight: 750; letter-spacing: -.03em; }
.group-title { margin: 24px 0 10px; color: var(--ink-3); font-size: .95rem; font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tile {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  color: var(--ink); text-decoration: none;
  transition: border-color .12s, transform .12s;
}
.tile:hover { border-color: var(--ink); transform: translateY(-2px); }
.tile-ico { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 11px; background: var(--surface-2); font-size: 1.3rem; transition: background-color .12s; }
.tile:hover .tile-ico { background: var(--hi); color: var(--hi-ink); }
.tile-txt { display: flex; flex-direction: column; min-width: 0; }
.tile-txt b { font-weight: 700; }
.tile-txt small { color: var(--ink-2); font-size: .86rem; line-height: 1.3; }

.link-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 12px; }
.link-card { padding: 16px 16px 10px; box-shadow: none; }
.link-card h3 { margin: 0 0 6px; padding: 0 4px; font-size: 1rem; }
.link-list { margin: 0; padding: 0; list-style: none; }
.link-list a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 6px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.link-list a:hover { background: var(--surface-2); }
.link-list .ext { color: var(--ink-3); opacity: 0; }
.link-list a:hover .ext, .link-list a:focus-visible .ext { opacity: 1; }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .clock-note { justify-self: start; transform: rotate(-1deg); padding: 16px 22px 14px; }
  .search-row { flex-direction: column; }
}

/* =========================================================
   ESTILO «BOARD»
   Se activa con html[data-style="board"]. Redefine los tokens
   de color/forma y la piel de la estructura general; los
   componentes (botones, tarjetas, tablas…) heredan de estas
   variables, así que no hace falta duplicarlos uno a uno.
   ========================================================= */
html[data-style="board"] {
  --paper: #d5dde6;
  --grid: transparent;
  --margin: transparent;
  --surface: #ffffff;
  --surface-2: #eef2f6;
  --line: #dbe2ea;
  --line-2: #c7d0da;
  --ink: #1c2733;
  --ink-2: #465264;
  --ink-3: #5b6b7b;
  --hi: #0f766e;
  --hi-ink: #ffffff;
  --hi-soft: #d7efec;
  --blue: #0f766e;
  --red: #b42318;
  --ok: #0f766e;
  --ok-bg: #d7efec;
  --bad: #b42318;
  --bad-bg: #fbe4e1;
  --shadow: 0 1px 2px rgba(28, 39, 51, .08), 0 18px 40px -18px rgba(28, 39, 51, .35);
  --radius: 14px;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-read: 'Avenir Next', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}
html[data-style="board"][data-theme="dark"] {
  --paper: #12171d; --grid: transparent; --margin: transparent;
  --surface: #1b222a; --surface-2: #242e38; --line: #2b3641; --line-2: #3a4756;
  --ink: #e7edf3; --ink-2: #c3ccd6; --ink-3: #93a3b3;
  --hi: #4fd1c5; --hi-ink: #0b1f1d; --hi-soft: #1f4a47;
  --blue: #4fd1c5; --red: #f97066;
  --ok: #4fd1c5; --ok-bg: #17332f; --bad: #f97066; --bad-bg: #3a201e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
}
@media (prefers-color-scheme: dark) {
  html[data-style="board"]:not([data-theme="light"]) {
    --paper: #12171d; --grid: transparent; --margin: transparent;
    --surface: #1b222a; --surface-2: #242e38; --line: #2b3641; --line-2: #3a4756;
    --ink: #e7edf3; --ink-2: #c3ccd6; --ink-3: #93a3b3;
    --hi: #4fd1c5; --hi-ink: #0b1f1d; --hi-soft: #1f4a47;
    --blue: #4fd1c5; --red: #f97066;
    --ok: #4fd1c5; --ok-bg: #17332f; --bad: #f97066; --bad-bg: #3a201e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 18px 40px -18px rgba(0, 0, 0, .7);
  }
}

html[data-style="board"] body {
  background-image: none;
  font-family: var(--font-ui);
}
html[data-style="board"] .brand-mark { border-radius: 9px; }
html[data-style="board"] .side { border-right: 1px solid var(--line); }
html[data-style="board"] .nav-link[aria-current="page"] { background: var(--hi-soft); color: var(--hi); }
html[data-style="board"] .nav-link:hover { background: var(--surface-2); }

html[data-style="board"] .card,
html[data-style="board"] dialog.dlg,
html[data-style="board"] .ex-card,
html[data-style="board"] .today-card,
html[data-style="board"] .link-card {
  border-radius: 14px;
  box-shadow: var(--shadow);
}
html[data-style="board"] .btn { border-radius: 8px; box-shadow: none; }
html[data-style="board"] .btn.primary { font-weight: 600; }
html[data-style="board"] .icon-btn { border-radius: 8px; }
html[data-style="board"] .input, html[data-style="board"] .select, html[data-style="board"] .textarea { border-radius: 8px; }
html[data-style="board"] .seg { border-radius: 10px; }
html[data-style="board"] .seg button { border-radius: 7px; }
html[data-style="board"] .seg button[aria-selected="true"], html[data-style="board"] .seg button[aria-pressed="true"] {
  box-shadow: none; background: var(--surface); color: var(--hi); font-weight: 700;
}
html[data-style="board"] .clock-note { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); transform: none; }
html[data-style="board"] .bs-logo { background: none; color: var(--hi); transform: none; }
html[data-style="board"] .tile:hover { border-color: var(--hi); }
html[data-style="board"] .tile:hover .tile-ico { background: var(--hi-soft); color: var(--hi); }
html[data-style="board"] .day.is-today,
html[data-style="board"] .cal-day.today { box-shadow: none; border-color: var(--hi); }
html[data-style="board"] .cal-day.selected { background: var(--hi); color: var(--hi-ink); }
html[data-style="board"] .option-btn.correct, html[data-style="board"] .blank.correct { background: var(--ok-bg); border-color: var(--ok); }
html[data-style="board"] .chip.tag-hi, html[data-style="board"] .badge.ok { background: var(--hi-soft); color: var(--hi); }
html[data-style="board"] .toast { border-radius: 10px; }
html[data-style="board"] .ttt-cell.win { background: var(--hi-soft); }
html[data-style="board"] .bd-toolbar, html[data-style="board"] .bd-foot { border-radius: 0; }

/* HORARIO */
.h-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; margin-bottom: 16px; }
.h-form .field { flex: 0 1 170px; }
.h-form .field.grow { flex: 1 1 240px; }
.h-form.editing { border-color: var(--blue); }
.h-actions { display: flex; gap: 8px; }
.h-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.h-tools .input { flex: 1 1 260px; max-width: 420px; }
.h-spacer { flex: 1 1 0; min-width: 0; }
.h-menu-wrap { position: relative; }
.h-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 5;
  display: flex; flex-direction: column; gap: 2px; min-width: 200px; padding: 6px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow);
}
.h-menu .btn { justify-content: flex-start; border: 0; background: transparent; }
.h-menu .btn:hover { background: var(--surface-2); }
@media (max-width: 560px) { .h-spacer { display: none; } }
.week { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; align-items: start; }
.day { padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.day.is-today { border-color: var(--ink); box-shadow: inset 0 4px 0 var(--hi); padding-top: 18px; }
.day header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.day h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.01em; }
.day > p { margin: 0; padding: 6px 0 4px; font-size: .92rem; }
.slots { margin: 0; padding: 0; list-style: none; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.slot:first-child { border-top: 0; }
.slot time { font-weight: 700; min-width: 3.2em; }
.slot-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.slot-tools { display: flex; opacity: .35; }
.slot:hover .slot-tools, .slot:focus-within .slot-tools, .slot.is-editing .slot-tools { opacity: 1; }
.slot.is-editing { background: var(--hi-soft); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
.icon-btn.sm { width: 32px; height: 32px; }
@media (hover: none) { .slot-tools { opacity: 1; } }

/* CALENDARIO */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.cal-head { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
.cal-title { flex: 1; margin: 0; font-size: 1.6rem; font-weight: 750; letter-spacing: -.03em; }
.cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-weekdays span { padding: 6px 0; text-align: center; font-size: .85rem; font-weight: 600; color: var(--ink-3); }
.cal-day {
  min-height: 46px; aspect-ratio: 1 / .92; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid transparent; border-radius: 12px; background: transparent; color: var(--ink);
  font-size: 1.05rem; font-weight: 600; overflow: hidden; padding: 2px;
}
.cal-day.empty { visibility: hidden; }
.cal-day:not(.empty):hover { background: var(--surface-2); }
.cal-day.today { border-color: var(--ink); }
.cal-day.selected { background: var(--hi); color: var(--hi-ink); border-color: transparent; }
.dots { display: flex; gap: 3px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--surface); }
.cal-day.selected .dots i { box-shadow: 0 0 0 1.5px var(--hi); }
.cal-daytitle { margin: 0 0 2px; font-size: 1.25rem; letter-spacing: -.02em; }
.cal-count { margin: 0 0 14px; font-size: .92rem; }
.ev-list { margin: 0 0 18px; padding: 0; list-style: none; }
.ev { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .dot { width: 12px; height: 12px; flex: none; border-radius: 50%; }
.ev-name { flex: 1; overflow-wrap: anywhere; }
.ev-empty { padding: 4px 0 8px; }
.ev-form { display: grid; gap: 12px; }
.ev-colors { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ev-colors button { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-2); }
.ev-colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.ev-colors input[type="color"] { width: 34px; height: 34px; padding: 0; border: 0; background: none; cursor: pointer; }
@media (max-width: 820px) { .cal-layout { grid-template-columns: minmax(0, 1fr); } .cal-title { font-size: 1.35rem; } }

/* NOTAS */
.nt-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 18px; }
.nt-search { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 220px; }
.nt-search .input { max-width: 380px; }
.nt-search-tools { display: flex; gap: 4px; }
.nt-composer {
  max-width: 660px; margin: 0 auto; padding: 10px 16px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); border-radius: 16px;
  transition: background-color .2s, color .2s;
}
.nt-composer.open { background: var(--note-bg); color: var(--note-ink); border-color: rgba(0, 0, 0, .16); padding: 14px 18px; }
.nt-composer:focus-within { outline: 3px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset: 1px; }
.nt-plain { display: block; width: 100%; padding: 6px 0; border: 0; outline: none; background: transparent; resize: none; color: inherit; }
.nt-plain::placeholder { color: currentColor; opacity: .55; }
.nt-title { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; }
.nt-body { font: 400 1.08rem/1.55 var(--font-read); }
.nt-composer:not(.open) .nt-body { height: 40px; overflow: hidden; }
.nt-composer:not(.open) .nt-title, .nt-composer:not(.open) .nt-extra { display: none; }
.nt-composer.open .nt-body { min-height: 110px; resize: vertical; }
.nt-extra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-top: 10px; }
.nt-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nt-actions .btn.ghost { color: inherit; }
.nt-hint { margin-right: 8px; font-size: .8rem; opacity: .65; }
.nt-err { margin: 6px 0 0; font-size: .9rem; font-weight: 600; }
.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.sw { position: relative; display: inline-flex; padding: 3px; cursor: pointer; }
.sw input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw-dot { display: block; width: 24px; height: 24px; border-radius: 50%; background: var(--c); border: 1px solid rgba(0, 0, 0, .25); }
.sw input:checked + .sw-dot, .sw-custom.active .sw-dot { box-shadow: 0 0 0 2px var(--note-bg, var(--surface)), 0 0 0 4px var(--note-ink, var(--ink)); }
.sw input:focus-visible + .sw-dot { outline: 3px solid var(--blue); outline-offset: 5px; }
.sw-custom .sw-dot { background: conic-gradient(#f44, #fd4, #4d6, #4dd, #46f, #d4d, #f44); }
.sw-custom.active .sw-dot { background: var(--c); }

.chess { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; align-items: start; }

  display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; aspect-ratio: 1;
  border: 3px solid var(--ink); border-radius: 6px; overflow: hidden;
}

.chess-promo { display: flex; gap: 10px; padding: 8px; }

/* SNAKE */

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const pad2 = (n) => String(n).padStart(2, '0');
const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
const fold = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Crea elementos sin pasar por innerHTML (el texto siempre se escapa) */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach((c) => {
    if (c == null || c === false) return;
    el.append(c.nodeType ? c : document.createTextNode(c));
  });
  return el;
}

/* localStorage puede fallar (modo privado, archivos locales…): siempre protegido */
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } },
  json(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  setJson(k, v) { return store.set(k, JSON.stringify(v)); }
};

function download(name, mime, content) {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   AVISO (toast) Y CONFIRMACIÓN
   ========================================================= */
let toastEl, toastText, toastBtn, toastTimer, toastAction = null;
function toast(message, action) {
  if (!toastEl) {
    toastText = h('span');
    toastBtn = h('button', { type: 'button', hidden: true, onclick: () => { const a = toastAction; hideToast(); if (a) a.run(); } });
    toastEl = h('div', { class: 'toast', role: 'status', 'aria-live': 'polite' }, toastText, toastBtn);
    document.body.append(toastEl);
  }
  toastText.textContent = message;
  toastAction = action || null;
  toastBtn.hidden = !action;
  if (action) toastBtn.textContent = action.label;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 7000 : 3200);
}
function hideToast() { if (toastEl) toastEl.classList.remove('show'); }

let confirmDlg;
function confirmDialog({ title, text = '', ok = 'Aceptar', cancel = 'Cancelar', danger = false }) {
  if (!confirmDlg) {
    confirmDlg = h('dialog', { class: 'dlg', 'aria-labelledby': 'confirm-title' },
      h('div', { class: 'dlg-head' }, h('h2', { id: 'confirm-title' })),
      h('div', { class: 'dlg-body' }, h('p', { class: 'muted', style: 'margin:0' })),
      h('div', { class: 'dlg-foot' },
        h('button', { type: 'button', class: 'btn', 'data-r': '0' }),
        h('button', { type: 'button', class: 'btn primary', 'data-r': '1' })));
    document.body.append(confirmDlg);
  }
  $('h2', confirmDlg).textContent = title;
  $('.dlg-body p', confirmDlg).textContent = text;
  $('.dlg-body', confirmDlg).hidden = !text;
  const [bCancel, bOk] = $$('button', confirmDlg);
  bCancel.textContent = cancel;
  bOk.textContent = ok;
  bOk.className = 'btn ' + (danger ? 'danger' : 'primary');
  return new Promise((resolve) => {
    const done = (v) => { confirmDlg.removeEventListener('close', onClose); confirmDlg.close(); resolve(v); };
    const onClose = () => resolve(false);
    bCancel.onclick = () => done(false);
    bOk.onclick = () => done(true);
    confirmDlg.addEventListener('close', onClose, { once: true });
    if (typeof confirmDlg.showModal === 'function') confirmDlg.showModal();
    else resolve(window.confirm(title));
  });
}

/* Botones de «dos pasos»: el primer clic pide confirmar, el segundo actúa */
function armedClick(btn, armedText, action) {
  if (btn.dataset.armed) { action(); return; }
  btn.dataset.armed = '1';
  btn.dataset.label = btn.textContent;
  btn.textContent = armedText;
  btn.classList.add('armed');
  setTimeout(() => {
    if (!btn.isConnected) return;
    delete btn.dataset.armed;
    btn.textContent = btn.dataset.label;
    btn.classList.remove('armed');
  }, 2500);
}

/* =========================================================
   ESTRUCTURA DE LA PÁGINA: navegación, rutas y temas
   ========================================================= */
const shell = {
  instances: {},

  buildNav() {
    const nav = $('#nav');
    nav.textContent = '';
    const groups = {};
    VIEWS.forEach((v) => { (groups[v.group] = groups[v.group] || []).push(v); });
    Object.keys(GROUPS).forEach((g) => {
      if (!groups[g]) return;
      const box = h('div', { class: 'nav-group' });
      if (GROUPS[g]) box.append(h('h2', { text: GROUPS[g] }));
      groups[g].forEach((v) => {
        box.append(h('a', { class: 'nav-link', href: '#/' + v.id, 'data-id': v.id, title: v.short || v.title, html: icon(v.icon) + '<span>' + esc(v.short || v.title) + '</span>' }));
      });
      nav.append(box);
    });
  },

  routeId() {
    const id = decodeURIComponent(location.hash.replace(/^#\/?/, '')) || 'inicio';
    return VIEWS.some((v) => v.id === id) ? id : 'inicio';
  },

  show(id) {
    const view = VIEWS.find((v) => v.id === id);
    const prev = app.current && this.instances[app.current];
    if (prev && app.current !== id) {
      prev.section.hidden = true;
      if (prev.api.hide) prev.api.hide();
    }
    app.current = id;

    let inst = this.instances[id];
    if (!inst) {
      const section = h('section', { class: 'view', id: 'view-' + id, hidden: true });
      const body = h('div', { class: 'view-body' });
      if (!view.noHead) {
        section.append(h('header', { class: 'page-head' },
          h('h1', { tabindex: '-1', text: view.title }),
          view.desc ? h('p', { text: view.desc }) : null));
      }
      section.append(body);
      $('#main').append(section);
      let api = {};
      try {
        api = view.mount(body, { view }) || {};
      } catch (err) {
        console.error(err);
        body.append(h('div', { class: 'card empty' }, h('h2', { text: 'No se ha podido cargar esta herramienta' }), h('p', { text: 'Recarga la página. Si el fallo continúa, el detalle está en la consola del navegador.' })));
      }
      inst = this.instances[id] = { section, api };
    }
    inst.section.hidden = false;
    if (inst.api.show) inst.api.show();

    $$('.nav-link').forEach((a) => {
      if (a.dataset.id === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    this.updateTitle();
    document.body.classList.remove('nav-open');
    $('#menuBtn').setAttribute('aria-expanded', 'false');
    window.scrollTo(0, 0);
    const heading = $('h1', inst.section);
    if (heading && !this.firstLoad) heading.focus({ preventScroll: true });
    this.firstLoad = false;
  },

  updateTitle() {
    const view = VIEWS.find((v) => v.id === app.current);
    if (!view) return;
    document.title = (view.id === 'inicio' ? 'Inicio' : view.title) + ' · ' + app.name();
  },

  route() { this.show(this.routeId()); },

  /* ---------- Tema claro / oscuro / automático ---------- */
  theme: 'auto',
  applyTheme(mode) {
    this.theme = mode;
    const root = document.documentElement;
    if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    store.set('ui-tema', mode);
  },
  cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    this.applyTheme(order[(order.indexOf(this.theme) + 1) % order.length]);
  },

  /* ---------- Estilo visual: Index (por defecto), Board o Fiz ---------- */
  styleName: 'index',
  applyStyle(name) {
    if (!['index', 'board', 'fiz', 'pastel', 'bosque', 'oceano'].includes(name)) name = 'index';
    this.styleName = name;
    document.documentElement.setAttribute('data-style', name);
    store.set('ui-estilo', name);
    document.dispatchEvent(new CustomEvent('estilo-cambiado'));
  },

  /* ---------- Nombre de usuario ---------- */
  userName: 'Bruno',
  applyName(name) {
    const clean = String(name || '').trim().slice(0, 30) || 'Bruno';
    this.userName = clean;
    store.set('ui-nombre', clean);
    const initial = clean.charAt(0).toUpperCase();
    $$('[data-name]').forEach((el) => { el.textContent = clean; });
    $$('[data-initial]').forEach((el) => { el.textContent = initial; });
    const fav = document.querySelector('link[rel="icon"]');
    if (fav) fav.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FFD426'/%3E%3Ctext x='12' y='17.5' font-family='Arial,sans-serif' font-weight='800' font-size='14' text-anchor='middle' fill='%23171C33'%3E" + encodeURIComponent(initial) + "%3C/text%3E%3C/svg%3E";
    this.updateTitle();
  },

  /* ---------- Modo de la barra lateral: fija, contraída o contraída con hover ---------- */
  navMode: 'full',
  applyNav(mode) {
    if (!['full', 'compact', 'hover'].includes(mode)) mode = 'full';
    this.navMode = mode;
    document.body.setAttribute('data-nav', mode);
    store.set('ui-nav', mode);
  },

  /* ---------- Sonido de la interfaz ---------- */
  soundOn: true,
  audioCtx: null,
  applySound(on) {
    this.soundOn = !!on;
    store.set('ui-sonido', this.soundOn ? '1' : '0');
  },
  ensureAudio() {
    if (!this.audioCtx) { try { this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.audioCtx = null; } }
    return this.audioCtx;
  },
  playClick() {
    if (!this.soundOn) return;
    const ctx = this.ensureAudio(); if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(760, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.05);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.1, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.09);
  }
};

function bootShell() {
  shell.buildNav();
  shell.firstLoad = true;
  $('#menuBtn').addEventListener('click', () => {
    const open = !document.body.classList.contains('nav-open');
    document.body.classList.toggle('nav-open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
  });
  $('#scrim').addEventListener('click', () => { document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
      document.body.classList.remove('nav-open');
      $('#menuBtn').setAttribute('aria-expanded', 'false');
      $('#menuBtn').focus();
    }
  });
  const savedTheme = store.get('ui-tema', 'auto');
  shell.applyTheme(['auto', 'light', 'dark'].includes(savedTheme) ? savedTheme : 'auto');
  const savedStyle = store.get('ui-estilo', 'index');
  shell.applyStyle(['index', 'board', 'fiz', 'pastel', 'bosque', 'oceano'].includes(savedStyle) ? savedStyle : 'index');
  shell.applyName(store.get('ui-nombre', 'Bruno'));
  shell.applyNav(store.get('ui-nav', 'full'));
  shell.applySound(store.get('ui-sonido', '1') !== '0');
  document.addEventListener('click', (e) => {
    const t = e.target.closest && e.target.closest('button, a, [role="link"], [role="radio"], [role="tab"], [role="button"]');
    if (t) shell.playClick();
  }, true);

  window.addEventListener('hashchange', () => shell.route());
  shell.route();
}

/* =========================================================
   BUSCADOR (lo comparten Inicio y la vista «Buscador»)
   ========================================================= */
const ENGINES = [
  { id: 'google', name: 'Google', url: 'https://www.google.com/search?q=' },
  { id: 'ddg', name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' }
];

function searchUrl(engineId, query) {
  const q = query.trim();
  const maps = /^\/maps\b\s*(.*)$/i.exec(q);
  if (maps) return 'https://www.google.com/maps' + (maps[1] ? '/search/' + encodeURIComponent(maps[1]) : '');
  const e = ENGINES.find((x) => x.id === engineId) || ENGINES[0];
  if (e.cse) return 'https://cse.google.com/cse?cx=' + e.cse + '&gsc.tab=0&q=' + encodeURIComponent(q);
  return e.url + encodeURIComponent(q);
}

function makeSearch({ big = false } = {}) {
  let engine = store.get('ui-buscador', 'google');
  if (!ENGINES.some((e) => e.id === engine)) engine = 'google';

  const input = h('input', { class: 'input search-input', type: 'search', name: 'q', placeholder: '¡A buscar se ha dicho!', 'aria-label': 'Buscar en la web', autocomplete: 'off', enterkeyhint: 'search' });
  const chips = h('div', { class: 'seg search-engines', role: 'radiogroup', 'aria-label': 'Buscador' });
  const form = h('form', { class: 'search' + (big ? ' search-big' : ''), role: 'search' },
    h('div', { class: 'search-row' }, input, h('button', { class: 'btn primary', type: 'submit', html: icon('search') + '<span>Buscar</span>' })),
    chips);

  function paint() {
    chips.textContent = '';
    ENGINES.forEach((e) => {
      chips.append(h('button', { type: 'button', role: 'radio', 'aria-checked': String(e.id === engine), 'aria-pressed': String(e.id === engine), text: e.name, onclick: () => set(e.id) }));
    });
  }
  function set(id, silent) {
    engine = id;
    if (!silent) store.set('ui-buscador', id);
    paint();
    if (!silent) form.dispatchEvent(new CustomEvent('engine', { detail: id }));
  }
  form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    if (!input.value.trim()) { input.focus(); return; }
    window.open(searchUrl(engine, input.value), '_blank', 'noopener');
  });
  paint();
  return {
    el: form, input,
    get engine() { return engine; },
    set,
    refresh() { const s = store.get('ui-buscador', 'google'); if (s !== engine && ENGINES.some((e) => e.id === s)) set(s, true); }
  };
}

}

function digitSpans(text) {
  return text.split('').map((c) => (/\d/.test(c) ? '<span class="dg">' + c + '</span>' : '<span class="cn">' + c + '</span>')).join('');
}

registerView({
  id: 'inicio', title: 'Inicio', group: 'inicio', icon: 'home', noHead: true,
  desc: 'Tu página de inicio.',
  mount(root) {
    const search = makeSearch();
    const dateEl = h('p', { class: 'hero-date' });
    const greetEl = h('span');
    const nameEl = h('span', { 'data-name': true, text: app.name() });
    const title = h('h1', { class: 'hero-title', tabindex: '-1' }, greetEl, ', ', nameEl, '.');
    const clockTime = h('div', { class: 'clock-time' });
    const clockSec = h('div', { class: 'clock-sec' });

    const hero = h('section', { class: 'hero' },
      h('div', { class: 'hero-text' }, dateEl, title, search.el),
      h('div', { class: 'clock-note', role: 'timer', 'aria-label': 'Hora actual' },
        h('div', { class: 'clock-row', 'aria-hidden': 'true' }, clockTime, clockSec)));

    const todayBox = h('section', { class: 'today', 'aria-label': 'Hoy' });
    const toolsBox = h('section', { class: 'block' });
    const linksBox = h('section', { class: 'block' });
    root.append(hero, todayBox, toolsBox, linksBox);

    /* ---- Reloj ---- */
    let lastMin = '', lastDay = '', timer = null;
    function tick() {
      const now = new Date();
      const hm = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
      if (hm !== lastMin) {
        lastMin = hm;
        clockTime.innerHTML = digitSpans(hm);
        const g = greeting(now.getHours());
        greetEl.textContent = g;
      }
      clockSec.innerHTML = digitSpans(pad2(now.getSeconds()));
      const day = isoDate(now);
      if (day !== lastDay) {
        lastDay = day;
        const long = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        dateEl.textContent = cap(long);
        renderToday();
      }
    }
    function schedule() { tick(); timer = setTimeout(schedule, 1000 - (Date.now() % 1000) + 5); }

    /* ---- Panel «Hoy»: lee Horario, Calendario y Notas ---- */
    function todayCard(title, link, body) {
      return h('article', { class: 'card today-card', tabindex: '0', role: 'link', 'aria-label': 'Ir a ' + title,
        onclick: () => app.go(link), onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); app.go(link); } } },
        h('div', { class: 'today-head' }, h('h2', { text: title })),
        body);
    }
    function renderToday() {
      const now = new Date();
      const dayName = DAYS[now.getDay()];
      const nowHM = pad2(now.getHours()) + ':' + pad2(now.getMinutes());

      // Clases
      const clases = store.json('asignaturas', []).filter((a) => a && a.dia === dayName && a.nombre)
        .sort((a, b) => String(a.hora).localeCompare(String(b.hora)));
      let nextIdx = clases.findIndex((c) => c.hora >= nowHM);
      const cList = h('ul', { class: 'mini-list' });
      clases.forEach((c, i) => {
        cList.append(h('li', { class: c.hora < nowHM ? 'past' : '' },
          h('time', { class: 'num', text: c.hora }), h('span', { text: c.nombre }),
          i === nextIdx ? h('span', { class: 'chip tag-hi', text: 'Siguiente' }) : null));
      });
      const cBody = clases.length ? cList : h('p', { class: 'muted', text: 'Hoy no tienes clases apuntadas.' });

      // Agenda
      const evs = (store.json('events', {}) || {})[isoDate(now)] || [];
      const eList = h('ul', { class: 'mini-list' });
      evs.forEach((ev) => eList.append(h('li', null, h('i', { class: 'dot', style: 'background:' + (/^#[0-9a-f]{3,8}$/i.test(ev.color) ? ev.color : 'var(--blue)') }), h('span', { text: ev.name }))));
      const eBody = evs.length ? eList : h('p', { class: 'muted', text: 'No hay nada planeado para hoy.' });

      // Notas destacadas (o las últimas)
      const notas = store.json('notas', []).filter((n) => n && (n.titulo || n.contenido));
      const favs = notas.filter((n) => n.favorita);
      const show = (favs.length ? favs : notas.slice(-3).reverse()).slice(0, 3);
      const nList = h('ul', { class: 'mini-list' });
      show.forEach((n) => nList.append(h('li', null, h('i', { class: 'dot', style: 'background:' + (/^#[0-9a-f]{6}$/i.test(n.color) ? n.color : 'var(--line-2)') + ';border:1px solid var(--line-2)' }), h('span', { text: n.titulo || String(n.contenido).slice(0, 60) }))));
      const nBody = show.length ? nList : h('p', { class: 'muted', text: 'Todavía no has escrito ninguna nota.' });

      todayBox.textContent = '';
      todayBox.append(
        todayCard('Clases de hoy', 'horario', cBody),
        todayCard('Agenda de hoy', 'calendario', eBody),
        todayCard(favs.length ? 'Notas favoritas' : 'Notas recientes', 'notas', nBody));
    }

    /* ---- Herramientas ---- */
    function renderTools() {
      toolsBox.textContent = '';
      toolsBox.append(h('h2', { class: 'block-title', text: 'Herramientas' }));
      Object.keys(GROUPS).forEach((g) => {
        const vs = VIEWS.filter((v) => v.group === g && v.id !== 'inicio');
        if (!vs.length) return;
        const grid = h('div', { class: 'tiles' });
        vs.forEach((v) => grid.append(h('a', { class: 'tile', href: '#/' + v.id },
          h('span', { class: 'tile-ico', html: icon(v.icon) }),
          h('span', { class: 'tile-txt' }, h('b', { text: v.short || v.title }), h('small', { text: v.tile || v.desc })))));
        toolsBox.append(h('h3', { class: 'group-title', text: GROUPS[g] }), grid);
      });
    }

    /* ---- Enlaces externos ---- */
    function renderLinks() {
      linksBox.textContent = '';
      linksBox.append(h('h2', { class: 'block-title', text: 'Enlaces' }));
      const grid = h('div', { class: 'link-groups' });
      LINKS.forEach((g) => {
        const ul = h('ul', { class: 'link-list' });
        g.items.forEach(([label, url]) => ul.append(h('li', null,
          h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, h('span', { text: label }), h('span', { html: icon('external'), class: 'ext' })))));
        grid.append(h('section', { class: 'card link-card' }, h('h3', { text: g.title }), ul));
      });
      linksBox.append(grid);
    }

    renderTools();
    renderLinks();
        window.addEventListener('storage', () => { if (app.isActive('inicio')) renderToday(); });

    return {
      show() { search.refresh(); lastDay = ''; schedule(); },
      hide() { clearTimeout(timer); }
    };
  }
});

/* =========================================================
   HORARIO
   Clave de almacenamiento: «asignaturas» (la misma de siempre)
   ========================================================= */
registerView({
  id: 'horario', title: 'Horario', group: 'estudiar', icon: 'horario',
  desc: 'Apunta tus clases por día y hora. Se guarda en este navegador.',
  tile: 'Tus clases de la semana',
  mount(root) {
    const WEEK = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const KEY = 'asignaturas';
    let items = load();
    let editing = -1;
    let onlyToday = false;
    let query = '';

    function load() {
      const raw = store.json(KEY, []);
      return (Array.isArray(raw) ? raw : []).filter((a) => a && typeof a.nombre === 'string' && WEEK.includes(a.dia) && typeof a.hora === 'string')
        .map((a) => ({ nombre: a.nombre, dia: a.dia, hora: a.hora }));
    }
    const save = () => store.setJson(KEY, items);

    /* ---------- Formulario ---------- */
    const fName = h('input', { class: 'input', id: 'h-nombre', type: 'text', placeholder: 'Matemáticas', required: true, maxlength: '60', autocomplete: 'off' });
    const fDay = h('select', { class: 'select', id: 'h-dia' }, WEEK.map((d) => h('option', { value: d, text: d })));
    const fTime = h('input', { class: 'input', id: 'h-hora', type: 'time', required: true });
    const btnSave = h('button', { class: 'btn primary', type: 'submit' });
    const btnCancel = h('button', { class: 'btn', type: 'button', text: 'Cancelar', hidden: true, onclick: () => stopEdit() });
    const form = h('form', { class: 'card h-form', autocomplete: 'off' },
      h('label', { class: 'field grow', for: 'h-nombre' }, 'Asignatura', fName),
      h('label', { class: 'field', for: 'h-dia' }, 'Día', fDay),
      h('label', { class: 'field', for: 'h-hora' }, 'Hora', fTime),
      h('div', { class: 'h-actions' }, btnSave, btnCancel));

    /* ---------- Filtros e importar/exportar ---------- */
    const search = h('input', { class: 'input', type: 'search', placeholder: 'Buscar asignatura o día', 'aria-label': 'Buscar asignatura o día', autocomplete: 'off' });
    const todayBtn = h('button', { class: 'btn', type: 'button', 'aria-pressed': 'false', text: 'Solo hoy' });
    const fileIn = h('input', { type: 'file', accept: '.json,.csv,application/json,text/csv', hidden: true });
    const importBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Importar horario (JSON o CSV)', 'aria-label': 'Importar horario', html: icon('upload'), onclick: () => fileIn.click() });
    const exportJsonBtn = h('button', { class: 'btn sm', type: 'button', text: 'Descargar como JSON', onclick: () => doExport('json') });
    const exportCsvBtn = h('button', { class: 'btn sm', type: 'button', text: 'Descargar como CSV', onclick: () => doExport('csv') });
    const exportMenu = h('div', { class: 'h-menu', hidden: true }, exportJsonBtn, exportCsvBtn);
    const exportBtn = h('button', { class: 'icon-btn', type: 'button', title: 'Exportar horario', 'aria-label': 'Exportar horario', 'aria-expanded': 'false', html: icon('download'), onclick: () => toggleExportMenu() });
    const tools = h('div', { class: 'h-tools' }, search, todayBtn, h('span', { class: 'h-spacer' }), importBtn, h('div', { class: 'h-menu-wrap' }, exportBtn, exportMenu), fileIn);

    function toggleExportMenu(open) {
      const v = open === undefined ? exportMenu.hidden : !open;
      exportMenu.hidden = !v;
      exportBtn.setAttribute('aria-expanded', String(v));
    }
    document.addEventListener('click', (e) => { if (!exportMenu.hidden && !e.target.closest('.h-menu-wrap')) toggleExportMenu(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !exportMenu.hidden) toggleExportMenu(false); });

    function doExport(formato) {
      toggleExportMenu(false);
      if (!items.length) { toast('No hay nada que exportar. Añade una asignatura primero.'); return; }
      if (formato === 'json') {
        download('horario.json', 'application/json', JSON.stringify({ version: 1, asignaturas: items }, null, 2));
      } else {
        const escCsv = (s) => { if (/^[=+\-@]/.test(s)) s = "'" + s; return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const lines = [['Asignatura', 'Día', 'Hora'], ...items.map((a) => [a.nombre, a.dia, a.hora])].map((f) => f.map(escCsv).join(';'));
        download('horario.csv', 'text/csv;charset=utf-8', '\ufeff' + lines.join('\r\n') + '\r\n');
      }
      toast('Horario descargado como horario.' + formato + '.');
    }

    function parseCSV(text) {
      text = text.replace(/^\uFEFF/, '');
      const first = text.split(/\r?\n/, 1)[0];
      const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
      const rows = []; let row = [], field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (quoted) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; } else field += c; }
        else if (c === '"') quoted = true;
        else if (c === sep) { row.push(field); field = ''; }
        else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); field = ''; rows.push(row); row = []; }
        else field += c;
      }
      if (field !== '' || row.length) { row.push(field); rows.push(row); }
      return rows.filter((r) => r.some((x) => x.trim() !== ''));
    }
    function normalizeRow(nombre, dia, hora) {
      nombre = String(nombre ?? '').trim();
      if (/^'[=+\-@]/.test(nombre)) nombre = nombre.slice(1);
      const d = WEEK.find((x) => fold(x) === fold(String(dia ?? '').trim()));
      const m = /^(\d{1,2}):(\d{2})(?::\d{2})?$/.exec(String(hora ?? '').trim());
      if (!nombre || !d || !m) return null;
      const hh = Number(m[1]), mm = Number(m[2]);
      if (hh > 23 || mm > 59) return null;
      return { nombre: nombre.slice(0, 200), dia: d, hora: pad2(hh) + ':' + m[2] };
    }
    function readImport(text) {
      const t = text.replace(/^\uFEFF/, '').trim();
      let candidates;
      if (t.startsWith('[') || t.startsWith('{')) {
        let data; try { data = JSON.parse(t); } catch (e) { return null; }
        const list = Array.isArray(data) ? data : data && data.asignaturas;
        if (!Array.isArray(list)) return null;
        candidates = list.map((a) => (a && typeof a === 'object' ? normalizeRow(a.nombre, a.dia, a.hora) : null));
      } else {
        let rows = parseCSV(t);
        if (rows.length && fold((rows[0][0] || '').trim()) === 'asignatura') rows = rows.slice(1);
        candidates = rows.map((r) => normalizeRow(r[0], r[1], r[2]));
      }
      const valid = candidates.filter(Boolean);
      return { valid, skipped: candidates.length - valid.length };
    }
    async function doImport(file) {
      if (file.size > 1024 * 1024) { toast('El archivo es demasiado grande. Usa un JSON o CSV de menos de 1 MB.'); return; }
      let result = null;
      try { result = readImport(await file.text()); } catch (e) { result = null; }
      if (!result || !result.valid.length) { toast('No se encontró ninguna asignatura válida en ese archivo.'); return; }
      const previous = items;
      if (editing >= 0) stopEdit();
      items = result.valid;
      save(); render();
      toast('Horario importado: ' + items.length + (items.length === 1 ? ' asignatura.' : ' asignaturas.') + (result.skipped ? ' (' + result.skipped + ' fila no válida omitida.)' : ''),
        { label: 'Deshacer', run: () => { items = previous; save(); render(); } });
    }
    fileIn.addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) doImport(f); });

    const week = h('div', { class: 'week' });
    const emptyMsg = h('div', { class: 'card empty', hidden: true },
      h('h2', { text: 'Todavía no hay clases' }),
      h('p', { text: 'Escribe la primera arriba, o importa un horario con el botón de subir archivo.' }));
    root.append(form, tools, week, emptyMsg);

    function paintForm() {
      btnSave.textContent = editing >= 0 ? 'Guardar cambios' : 'Añadir clase';
      btnCancel.hidden = editing < 0;
      form.classList.toggle('editing', editing >= 0);
    }
    function stopEdit() {
      editing = -1;
      form.reset();
      fDay.value = WEEK[Math.min(4, Math.max(0, (new Date().getDay() + 6) % 7))];
      paintForm();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = fName.value.trim();
      if (!nombre || !fTime.value) return;
      const entry = { nombre, dia: fDay.value, hora: fTime.value };
      if (editing >= 0) items[editing] = entry; else items.push(entry);
      save();
      const wasEditing = editing >= 0;
      stopEdit();
      render();
      toast(wasEditing ? 'Clase actualizada.' : 'Clase añadida.');
      fName.focus();
    });

    function startEdit(i) {
      const a = items[i];
      editing = i;
      fName.value = a.nombre; fDay.value = a.dia; fTime.value = a.hora;
      paintForm();
      form.scrollIntoView({ block: 'center', behavior: 'smooth' });
      fName.focus({ preventScroll: true });
    }
    function remove(i) {
      const [gone] = items.splice(i, 1);
      if (editing === i) stopEdit(); else if (editing > i) editing--;
      save();
      render();
      toast('Clase eliminada.', { label: 'Deshacer', run: () => { items.splice(Math.min(i, items.length), 0, gone); save(); render(); } });
    }

    search.addEventListener('input', () => { query = fold(search.value.trim()); render(); });
    todayBtn.addEventListener('click', () => {
      onlyToday = !onlyToday;
      todayBtn.setAttribute('aria-pressed', String(onlyToday));
      render();
    });

    /* ---------- Semana ---------- */
    function render() {
      const todayName = DAYS[new Date().getDay()];
      week.textContent = '';
      emptyMsg.hidden = items.length > 0;
      week.hidden = items.length === 0;

      const matches = (a) => !query || fold(a.nombre).includes(query) || fold(a.dia).includes(query);
      const filtering = !!query || onlyToday;

      WEEK.forEach((day) => {
        if (onlyToday && day !== todayName) return;
        const rows = items.map((a, i) => ({ a, i })).filter((x) => x.a.dia === day && matches(x.a))
          .sort((x, y) => x.a.hora.localeCompare(y.a.hora));
        const weekend = day === 'Sábado' || day === 'Domingo';
        if (!rows.length && (filtering || weekend)) return;

        const list = h('ul', { class: 'slots' });
        rows.forEach(({ a, i }) => {
          list.append(h('li', { class: 'slot' + (editing === i ? ' is-editing' : '') },
            h('time', { class: 'num', text: a.hora }),
            h('span', { class: 'slot-name', text: a.nombre }),
            h('span', { class: 'slot-tools' },
              h('button', { class: 'icon-btn sm', type: 'button', title: 'Editar', 'aria-label': 'Editar ' + a.nombre + ', ' + a.dia, html: icon('edit'), onclick: () => startEdit(i) }),
              h('button', { class: 'icon-btn sm', type: 'button', title: 'Eliminar', 'aria-label': 'Eliminar ' + a.nombre + ', ' + a.dia, html: icon('trash'), onclick: () => remove(i) }))));
        });
        week.append(h('section', { class: 'day' + (day === todayName ? ' is-today' : '') },
          h('header', null, h('h2', { text: day }), day === todayName ? h('span', { class: 'chip tag-hi', text: 'Hoy' }) : null),
          rows.length ? list : h('p', { class: 'muted', text: 'Sin clases' })));
      });
      if (!week.children.length && items.length) {
        week.append(h('div', { class: 'card empty', style: 'grid-column:1/-1' }, h('h2', { text: 'Nada coincide' }), h('p', { text: 'Prueba con otra palabra o quita el filtro «Solo hoy».' })));
      }
    }

    stopEdit();
    render();
    return { show() { render(); } };
  }
});

/* =========================================================
   CALENDARIO

registerView({
  id: 'calendario', title: 'Calendario', group: 'estudiar', icon: 'calendar',

    const today = new Date();
    const state = { view: new Date(today.getFullYear(), today.getMonth(), 1), selected: isoDate(today), color: PRESETS[0], events: load() };

    function load() { const d = store.json(KEY, {}); return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; }
    const save = () => store.setJson(KEY, state.events);
    const safeColor = (c) => (/^#[0-9a-f]{3,8}$/i.test(c) ? c : PRESETS[0]);

        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Mes anterior', html: icon('chevL'), onclick: () => changeMonth(-1) }),
        h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Mes siguiente', html: icon('chevR'), onclick: () => changeMonth(1) })),
      h('div', { class: 'cal-weekdays', 'aria-hidden': 'true' }, ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map((d) => h('span', { text: d }))),

    const colorsEl = h('div', { class: 'ev-colors', role: 'group', 'aria-label': 'Color del evento' });

    const side = h('aside', { class: 'card', 'aria-label': 'Eventos del día' }, dayTitle, dayCount, list, form);

    });
    root.append(h('div', { class: 'cal-layout' }, calPanel, side));

    function renderCalendar(focusISO) {
      const y = state.view.getFullYear(), m = state.view.getMonth();

      const total = new Date(y, m + 1, 0).getDate();

        const iso = isoDate(new Date(y, m, d));
        const evs = state.events[iso] || [];
        const dots = h('span', { class: 'dots' });
        evs.slice(0, 3).forEach((ev) => dots.append(h('i', { style: 'background:' + safeColor(ev.color) })));

    daysEl.addEventListener('click', (e) => { const b = e.target.closest('.cal-day[data-date]'); if (b) selectDate(b.dataset.date, true); });

    window.addEventListener('storage', (e) => { if (e.key === KEY) { state.events = load(); renderCalendar(); renderDay(); } });
    return { show() { state.events = load(); renderCalendar(); renderDay(); } };
  }
});

   ========================================================= */
registerView({
  id: 'tres-en-raya', title: 'Tres en raya', group: 'juegos', icon: 'ttt',
  desc: 'Dos jugadores en la misma pantalla, o contra la máquina.',
  tile: 'Dos jugadores o contra la máquina',
  mount(root) {
    const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    let board, turn, over, cpu = store.get('ttt-cpu') === '1', winLine = null;
    const score = { X: 0, O: 0, tie: 0 };

    const cells = Array.from({ length: 9 }, (_, i) => h('button', { type: 'button', class: 'ttt-cell', 'data-i': i, 'aria-label': 'Casilla ' + (i + 1) + ', vacía', onclick: () => play(i) }));
    const grid = h('div', { class: 'ttt-grid', role: 'group', 'aria-label': 'Tablero' }, cells);
    const status = h('p', { class: 'ttt-status', role: 'status', 'aria-live': 'polite' });
    const sX = h('b', { class: 'num' }), sO = h('b', { class: 'num' }), sT = h('b', { class: 'num' });
    const modeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Modo de juego' },
      h('button', { type: 'button', 'aria-pressed': String(!cpu), text: '2 jugadores', onclick: () => setMode(false) }),
      h('button', { type: 'button', 'aria-pressed': String(cpu), text: 'Contra la máquina', onclick: () => setMode(true) }));
    root.append(h('div', { class: 'ttt' },
      h('div', { class: 'ttt-main' }, modeSeg, status, grid, h('button', { class: 'btn', type: 'button', text: 'Nueva partida', onclick: reset })),
      h('aside', { class: 'card ttt-score' }, h('h2', { text: 'Marcador' }),
        h('p', null, h('span', { class: 'p-x', text: 'X' }), sX), h('p', null, h('span', { class: 'p-o', text: 'O' }), sO), h('p', null, h('span', { text: 'Empates' }), sT))));

    function setMode(v) { cpu = v; store.set('ttt-cpu', v ? '1' : '0'); $$('button', modeSeg).forEach((b, i) => b.setAttribute('aria-pressed', String((i === 1) === v))); score.X = score.O = score.tie = 0; reset(); }
    const winner = (b) => { for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { p: b[l[0]], line: l }; return null; };
    function paint() {
      cells.forEach((c, i) => {
        c.textContent = board[i]; c.className = 'ttt-cell' + (board[i] ? ' p-' + board[i].toLowerCase() : '') + (winLine && winLine.includes(i) ? ' win' : '');
        c.disabled = over || !!board[i];
        c.setAttribute('aria-label', 'Casilla ' + (i + 1) + ', ' + (board[i] ? board[i] : 'vacía'));
      });
      sX.textContent = score.X; sO.textContent = score.O; sT.textContent = score.tie;
    }
    function say() { if (!over) status.textContent = cpu && turn === 'O' ? 'Piensa la máquina…' : 'Turno de ' + turn; }
    function reset() { board = Array(9).fill(''); turn = 'X'; over = false; winLine = null; paint(); say(); }
    function finish() {
      const w = winner(board);
      if (w) { over = true; winLine = w.line; score[w.p]++; status.textContent = (cpu && w.p === 'O' ? 'Gana la máquina (O)' : 'Gana ' + w.p) + '.'; }
      else if (board.every(Boolean)) { over = true; score.tie++; status.textContent = 'Empate.'; }
      paint(); return over;
    }
    function play(i) {
      if (over || board[i] || (cpu && turn === 'O')) return;
      board[i] = turn; paint();
      if (finish()) return;
      turn = turn === 'X' ? 'O' : 'X'; say();
      if (cpu && turn === 'O') setTimeout(cpuMove, 350);
    }
    // Minimax: la máquina no pierde nunca
    function minimax(b, p) {
      const w = winner(b); if (w) return { s: w.p === 'O' ? 1 : -1 };
      const free = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0); if (!free.length) return { s: 0 };
      let bestM = null;
      for (const i of free) { b[i] = p; const r = minimax(b, p === 'O' ? 'X' : 'O'); b[i] = ''; if (bestM === null || (p === 'O' ? r.s > bestM.s : r.s < bestM.s)) bestM = { s: r.s, i }; }
      return bestM;
    }
    function cpuMove() {
      if (over) return;
      const free = board.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
      const i = free.length === 9 ? free[Math.floor(Math.random() * 9)] : minimax([...board], 'O').i;
      board[i] = 'O'; paint();
      if (finish()) return;
      turn = 'X'; say();
    }
    reset();
  }
});
