<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier · Estudio de diseño offline</title>
<style>
:root{--bg:#eef0f6;--panel:#fff;--line:#e2e5ee;--ink:#21242d;--muted:#778;--acc:#6c47ff;--acc2:#00b8c4;--soft:#f4f2ff;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#14161d;--panel:#1d2029;--line:#2c3040;--ink:#e8eaf2;--muted:#9aa0b5;--soft:#262a3a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.view{height:100%;display:flex;flex-direction:column}
.view[hidden],[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:8px;transition:.12s}
button:hover{border-color:var(--acc);color:var(--acc)}
button:disabled{opacity:.35;pointer-events:none}
button.on,.tg.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:#5836e8;color:#fff}
input[type=text],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0}
input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
input[type=range]{accent-color:var(--acc)}
.sp{flex:1}
/* HOME */
.hhead{display:flex;align-items:center;gap:12px;padding:14px 24px;background:linear-gradient(100deg,#5b3df0,#00b8c4);color:#fff}
.hhead .logo{font-size:22px;font-weight:800;letter-spacing:.5px}
.hhead .hsub{opacity:.9}
.hhead button{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4);color:#fff}
.hbody{flex:1;display:flex;min-height:0}
.hside{width:290px;padding:18px;overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.hmain{flex:1;padding:22px 26px;overflow:auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.fmt{display:flex;width:100%;align-items:center;gap:12px;text-align:left;padding:9px 10px;margin-bottom:6px;border-radius:12px}
.fmt .ar{display:flex;align-items:center;justify-content:center;border:2px solid var(--muted);border-radius:4px;flex:none;font-size:14px;font-style:normal;color:var(--muted)}
.fmt small{display:block;color:var(--muted)}
.fmt.on{border-color:var(--acc);background:var(--soft);color:var(--ink)}
.fmt.on .ar{border-color:var(--acc);color:var(--acc)}
.cust{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.cust input{width:90px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tpl{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;align-items:center;text-align:center}
.tpl:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(60,40,160,.18)}
.tpl .cvw{height:160px;display:flex;align-items:center;justify-content:center;width:100%;background:repeating-conic-gradient(#0000000a 0 25%,#0000 0 50%) 0 0/16px 16px;border-radius:8px}
.tpl canvas{max-width:100%;max-height:100%;box-shadow:0 3px 12px rgba(0,0,0,.25)}
.tpl .em{font-size:54px}
.tpl small{color:var(--muted)}
/* EDITOR */
.top{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top #docName{width:170px;font-weight:600}
.chip{background:var(--soft);border-color:transparent}
.tg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.zoomw{display:flex;align-items:center;gap:4px}
.zoomw input{width:90px}
.menu{position:relative}
#expMenu{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:30;min-width:240px;padding:6px}
#expMenu button{display:block;width:100%;text-align:left;border:0;margin:0}
.ebody{flex:1;display:flex;min-height:0}
#rail{width:78px;background:var(--panel);border-right:1px solid var(--line);padding:8px 6px;display:flex;flex-direction:column;gap:5px;overflow:auto;flex:none}
#rail button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;font-size:11px;border-color:transparent}
#rail button span{font-size:20px;line-height:1.1}
#rail hr{width:100%;border:0;border-top:1px solid var(--line);margin:3px 0}
#stage.inf{padding:0;overflow:hidden;display:block}#stage.inf #wrap{margin:0;box-shadow:none}
#flyout{position:fixed;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:grid;grid-template-columns:repeat(4,52px);gap:6px}
#flyout button{height:52px;font-size:26px;padding:0}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
#ctx{display:flex;gap:10px;align-items:center;padding:6px 12px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.swc{display:flex;gap:5px}
.swc i{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003;cursor:pointer;display:block}
#stage{flex:1;overflow:auto;display:flex;padding:28px;background:var(--bg);position:relative}
#wrap{margin:auto;box-shadow:0 10px 40px rgba(20,20,60,.28);flex:none;line-height:0}
#cv{display:block;touch-action:none;background:#fff}
#pages{display:flex;gap:10px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;align-items:center;flex:none;min-height:94px}
.pth{flex:none;cursor:pointer;position:relative;border:2px solid var(--line);border-radius:6px;background:#fff;line-height:0;overflow:hidden}
.pth.on{border-color:var(--acc);box-shadow:0 0 0 2px #6c47ff44}
.pth canvas{display:block;width:120px;max-height:80px;object-fit:contain;background:#fff}
.pth span{position:absolute;left:3px;bottom:3px;background:#000a;color:#fff;font:11px system-ui;padding:1px 6px;border-radius:9px;line-height:1.4}
.pth.over{outline:2px dashed var(--acc)}
.pops{display:flex;flex-direction:column;gap:4px;flex:none}
.pops button{padding:3px 9px;font-size:12px}
#props{width:278px;background:var(--panel);border-left:1px solid var(--line);padding:12px 14px 30px;overflow:auto;flex:none}
.ptitle{font-weight:700;font-size:15px;margin-bottom:6px}
#props h3{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>label{flex:0 0 86px;font-size:12px;color:var(--muted)}
.row input[type=range]{flex:1;min-width:0}
.row input[type=number],.row select{flex:1}
.row input[type=text]{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:6px}.grid2 .row{margin-bottom:0}.grid2 .row>label{flex:0 0 auto!important}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
#props button{padding:5px 4px;font-size:12px}
#props textarea{width:100%;min-height:74px;resize:vertical;margin-bottom:8px}
.empty{color:var(--muted);line-height:1.6}
.hint{position:absolute;left:14px;bottom:6px;font-size:11px;color:var(--muted);pointer-events:none}
.sw{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 8px}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid #0003;cursor:pointer}
/* MODAL */
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal>div{background:var(--panel);border-radius:16px;padding:20px;max-width:960px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px #0007}
#modal h2{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#22252e;color:#fff;padding:9px 16px;border-radius:20px;z-index:200;font-size:13px}
/* SHEET */
.sbar{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.sbar .vs{width:1px;height:22px;background:var(--line);margin:0 4px}
#fbarw{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#fbarw b{color:var(--muted);min-width:44px;text-align:center}
#fbar{flex:1}
#gridw{flex:1;overflow:auto;background:var(--panel);outline:0}
table#grid{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
#grid th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-weight:600;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:2;height:24px;cursor:pointer;user-select:none}
#grid th.rh{position:sticky;left:0;top:auto;z-index:1;width:46px;min-width:46px}
#grid th.corner{left:0;z-index:3;width:46px}
#grid th.hl{background:#6c47ff33;color:var(--acc)}
#grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:26px;width:104px;min-width:104px;max-width:104px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:clip;cursor:cell;user-select:none;background:var(--panel)}
#grid td.sel{background:#6c47ff22!important}
#grid td.act{outline:2px solid var(--acc);outline-offset:-2px}
#grid td input{width:100%;height:100%;border:0;outline:0;background:var(--panel);padding:0;margin:0}
.stabs{display:flex;gap:4px;padding:6px 12px;background:var(--panel);border-top:1px solid var(--line);align-items:center;overflow:auto}
.stabs button.on{background:var(--soft);color:var(--acc);border-color:var(--acc)}
@media(max-width:900px){.hside{width:200px}#props{width:220px}}
@media(max-width:700px){.hbody{flex-direction:column}.hside{width:auto;border-right:0;border-bottom:1px solid var(--line);max-height:200px}.ebody{flex-wrap:wrap}#props{width:100%;max-height:34vh;border-left:0;border-top:1px solid var(--line)}#rail{flex-direction:row;width:100%;border-right:0;border-bottom:1px solid var(--line)}#rail button{min-width:62px}}
</style>
</head>
<body>

<!-- INICIO -->
<div id="home" class="view">
  <div class="hhead"><div class="logo">◆ Atelier</div><span class="hsub">Presentaciones, carteles, pizarras, dibujo y hojas de cálculo · 100% offline</span><span class="sp"></span><button id="hCont" hidden>↻ Continuar último proyecto</button><button id="hOpen">📂 Abrir proyecto</button></div>
  <div class="hbody">
    <aside class="hside"><h2>1 · Elige un formato</h2><div id="fmtlist"></div></aside>
    <section class="hmain"><h2 id="tplTitle">2 · Elige una plantilla</h2><div id="custbox" class="cust" hidden>Ancho <input type="number" id="cw" value="1200" min="100" max="8000"> Alto <input type="number" id="ch" value="800" min="100" max="8000"> px</div><div id="tplgrid" class="tplgrid"></div></section>
  </div>
</div>

<!-- EDITOR -->
<div id="ed" class="view" hidden>
  <header class="top">
    <button id="eHome" title="Volver al inicio">◆ Inicio</button>
    <input type="text" id="docName" value="Sin título">
    <button id="eFmt" class="chip" title="Cambiar de formato"></button>
    <span class="sp"></span>
    <button id="undo" title="Deshacer (Ctrl+Z)">↶</button><button id="redo" title="Rehacer (Ctrl+Y)">↷</button>
    <label class="tg"><input type="checkbox" id="gGrid"> Cuadrícula</label>
    <label class="tg"><input type="checkbox" id="gSnap" checked> Imán</label>
    <div class="zoomw"><button id="zm">−</button><input type="range" id="zoom" min="5" max="300" value="50"><button id="zp">+</button><button id="zfit">Ajustar</button></div>
    <button id="eSave" title="Guardar proyecto (.json)">💾 Guardar</button>
    <div class="menu"><button id="expBtn" class="primary">⬇ Exportar ▾</button>
      <div id="expMenu" hidden>
        <button data-x="pdf">📄 PDF (todas las páginas)</button>
        <button data-x="png">🖼 PNG · página actual</button>
        <button data-x="png2">🖼 PNG alta resolución (2×)</button>
        <button data-x="jpg">🖼 JPG · página actual</button>
        <button data-x="allpng">🗂 Todas las páginas en PNG</button>
      </div></div>
  </header>
  <div class="ebody">
    <nav id="rail">
      <button data-tool="sel" class="on"><span>↖</span>Mover</button>
      <button data-add="text"><span>T</span>Texto</button>
      <button id="rShapes"><span>◆</span>Formas</button>
      <button data-add="sticky"><span>🗒</span>Nota</button>
      <button id="rImg"><span>🖼</span>Imagen</button>
      <hr>
      <button data-tool="pen"><span>✎</span>Lápiz</button>
      <button data-tool="hl"><span>🖍</span>Marcador</button>
      <button data-tool="er"><span>⌫</span>Goma</button>
      <button data-tool="hand" id="rHand" hidden><span>✋</span>Mano</button>
      <hr>
      <button id="rTpl"><span>▦</span>Plantillas</button>
    </nav>
    <div id="flyout" hidden></div>
    <div class="center">
      <div id="ctx" hidden><b id="ctxName">Lápiz</b><div class="swc" id="brushSw"></div><input type="color" id="brushCol" value="#222222"><label>Grosor <input type="range" id="brushSize" min="1" max="60" value="6"></label><span id="brushVal">6</span><span class="sp"></span><button id="ctxDone">✓ Terminar</button></div>
      <div id="stage"><div id="wrap"><canvas id="cv"></canvas></div><div class="hint" id="hint">Doble clic para editar texto · Mayús = multiselección / proporción · Supr borra · Ctrl+C/V/D · Flechas mueven · Suelta imágenes aquí</div></div>
      <div id="pages"></div>
    </div>
    <aside id="props"></aside>
  </div>
</div>

<!-- HOJA DE CÁLCULO -->
<div id="sh" class="view" hidden>
  <div class="sbar">
    <button id="sHome">◆ Inicio</button>
    <input type="text" id="sName" value="Hoja sin título" style="width:170px;font-weight:600">
    <span class="vs"></span>
    <button id="sUndo">↶</button><button id="sRedo">↷</button>
    <span class="vs"></span>
    <button data-sf="b"><b>N</b></button><button data-sf="i"><i>K</i></button>
    <button data-sf="l">⬅</button><button data-sf="c">↔</button><button data-sf="r">➡</button>
    <label title="Color de relleno">🎨<input type="color" id="sFill" value="#fff59d"></label>
    <label title="Color de texto">A<input type="color" id="sFc" value="#222222"></label>
    <button id="sNoFmt">Quitar formato</button>
    <span class="vs"></span>
    <button id="sSum">Σ Autosuma</button>
    <button id="sRows">＋ 20 filas</button>
    <button id="sClear">Vaciar selección</button>
    <span class="sp"></span>
    <button id="sSave">💾 Guardar</button>
    <button id="sCsv" class="primary">⬇ CSV</button>
    <button id="sXls">⬇ Excel (.xls)</button>
  </div>
  <div id="fbarw"><b id="fcell">A1</b><span>ƒx</span><input type="text" id="fbar" placeholder="Escribe un valor o una fórmula, p. ej. =SUMA(B2:B9)"></div>
  <div id="gridw" tabindex="0"></div>
  <div class="stabs" id="stabs"></div>
</div>

<div id="modal" hidden></div>
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileOpen" accept=".json,application/json" hidden>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const hexA=(h,a)=>{h=(h||'#000000').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16)||0;return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const lum=h=>{h=(h||'#fff').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16)||0;return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};
const toast=(t,ms=2200)=>{let e=$('#toast');if(e)e.remove();e=document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),ms)};
const download=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
const dlBlob=(blob,name)=>{const u=URL.createObjectURL(blob);download(u,name);setTimeout(()=>URL.revokeObjectURL(u),4000)};
const safeName=s=>(s||'diseno').replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,'').trim().replace(/\s+/g,'-')||'diseno';

/* ================= FORMATOS ================= */
const FORMATS=[
 {id:'slide',name:'Presentación 16:9',w:1920,h:1080,cat:'slide',multi:1,icon:'▶'},
 {id:'slide43',name:'Presentación 4:3',w:1440,h:1080,cat:'slide',multi:1,icon:'▶'},
 {id:'poster',name:'Cartel vertical',w:1240,h:1754,cat:'hero',icon:'🗞'},
 {id:'posterh',name:'Cartel horizontal',w:1754,h:1240,cat:'hero',icon:'🗞'},
 {id:'social',name:'Post cuadrado',w:1080,h:1080,cat:'hero',multi:1,icon:'◻'},
 {id:'social45',name:'Post vertical 4:5',w:1080,h:1350,cat:'hero',multi:1,icon:'◻'},
 {id:'custom',name:'Tamaño personalizado',w:1200,h:800,cat:'hero',multi:1,custom:1,icon:'⇲'},
 {id:'board',name:'Pizarra infinita',w:3200,h:1800,cat:'board',icon:'🧠'},
 {id:'sheet',name:'Hoja de cálculo',cat:'sheet',icon:'▦'}
];
const fmtById=id=>FORMATS.find(f=>f.id===id);
const fmtCopy=f=>({id:f.id,name:f.name,cat:f.cat,multi:f.multi?1:0});

/* ================= TEMAS / PLANTILLAS ================= */
const THEMES=[
 {id:'violeta',name:'Violeta vivo',bg:['#f6f1ff','#e3f6ff',160],ink:'#22252e',sub:'#5b6075',acc:'#6c47ff',acc2:'#00c4cc',acc3:'#ffc857',font:'Trebuchet MS'},
 {id:'neon',name:'Noche neón',bg:['#0e0f20','#241552',150],ink:'#ffffff',sub:'#b9b6e8',acc:'#ff2d92',acc2:'#00e5ff',acc3:'#ffe14d',font:'Impact'},
 {id:'sunset',name:'Atardecer',bg:['#ff6f61','#ffc371',140],ink:'#ffffff',sub:'#fff3e0',acc:'#ffffff',acc2:'#ffe9a8',acc3:'#ffffff',font:'Georgia'},
 {id:'corp',name:'Corporativo',bg:['#ffffff',null,0],ink:'#12264a',sub:'#5a6b8c',acc:'#1f5fd1',acc2:'#7fb0ff',acc3:'#12264a',font:'Verdana'},
 {id:'pastel',name:'Pastel',bg:['#fff4ea','#ffe9ef',150],ink:'#4a3b36',sub:'#8a7770',acc:'#f28f8f',acc2:'#8fd3c7',acc3:'#ffd9a0',font:'Georgia'},
 {id:'mini',name:'Minimal',bg:['#ffffff',null,0],ink:'#111111',sub:'#666666',acc:'#111111',acc2:'#999999',acc3:'#111111',font:'Times New Roman'},
 {id:'nature',name:'Naturaleza',bg:['#eef8ee','#d3ead6',170],ink:'#1d3b27',sub:'#4f7358',acc:'#2e8b57',acc2:'#f4c95d',acc3:'#2e8b57',font:'Georgia'},
 {id:'bold',name:'Amarillo audaz',bg:['#ffd60a',null,0],ink:'#111111',sub:'#3a3400',acc:'#111111',acc2:'#ffffff',acc3:'#111111',font:'Impact'},
 {id:'ocean',name:'Océano',bg:['#0b2a4a','#0f6b7a',160],ink:'#ffffff',sub:'#bfe7ee',acc:'#4dd0e1',acc2:'#ffffff',acc3:'#ffd166',font:'Trebuchet MS'},
 {id:'terra',name:'Terracota',bg:['#f6e7d8',null,0],ink:'#4a2a1d',sub:'#8a5a44',acc:'#c4572f',acc2:'#e8a87c',acc3:'#4a2a1d',font:'Georgia'},
 {id:'lav',name:'Lavanda',bg:['#f3eefc','#e0d4fa',150],ink:'#2d1f4d',sub:'#6b5a94',acc:'#8e6bd9',acc2:'#f4a6d7',acc3:'#2d1f4d',font:'Verdana'},
 {id:'carbon',name:'Carbón',bg:['#16181d',null,0],ink:'#ffffff',sub:'#aab0bd',acc:'#ffffff',acc2:'#8a94a8',acc3:'#ffffff',font:'Impact'},
 {id:'retro',name:'Retro 70s',bg:['#fff1d0',null,0],ink:'#3b2a1a',sub:'#7a5c3a',acc:'#e8743b',acc2:'#f2b134',acc3:'#2f7f79',font:'Georgia'},

function startStroke(p){
  const hl=tool==='hl',o=mk('path',{x:0,y:0,w:doc.W,h:doc.H,bw:doc.W,bh:doc.H,pts:[[p.x,p.y]],stroke:brush.color,sw:hl?brush.size*2.2:brush.size,op:hl?.4:1});
  pg().objs.push(o);drag={mode:'stroke',o};draw();
}
function endStroke(o){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;o.pts.forEach(([x,y])=>{x1=Math.min(x1,x);y1=Math.min(y1,y);x2=Math.max(x2,x);y2=Math.max(y2,y)});
  if(x2-x1<12){const m=(x1+x2)/2;x1=m-6;x2=m+6}if(y2-y1<12){const m=(y1+y2)/2;y1=m-6;y2=m+6}
  o.pts=o.pts.map(([x,y])=>[x-x1,y-y1]);o.x=x1;o.y=y1;o.w=o.bw=x2-x1;o.h=o.bh=y2-y1;
}
const dseg=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p.x-a[0])*dx+(p.y-a[1])*dy)/l:0;t=clamp(t,0,1);return Math.hypot(p.x-(a[0]+t*dx),p.y-(a[1]+t*dy))};
function eraseAt(p){
  const rad=brush.size*1.2+8,O=pg().objs;let any=false;
  for(let i=O.length-1;i>=0;i--){const o=O[i];if(o.type!=='path'||o.lock)continue;
    const cx=o.x+o.w/2,cy=o.y+o.h/2,ca=Math.cos(o.rot||0),sa=Math.sin(o.rot||0),sx=o.w/o.bw,sy=o.h/o.bh;
    const P=o.pts.map(q=>{const lx=(q[0]-o.bw/2)*sx,ly=(q[1]-o.bh/2)*sy;return[cx+lx*ca-ly*sa,cy+lx*sa+ly*ca]});
    let hitp=P.length===1?Math.hypot(p.x-P[0][0],p.y-P[0][1])<rad+o.sw:false;
    for(let j=0;j<P.length-1&&!hitp;j++)if(dseg(p,P[j],P[j+1])<rad+o.sw/2)hitp=true;
    if(hitp){O.splice(i,1);any=true}}
  if(any){S=[];drag.erased=true;draw()}
}

/* ---------- interacción con el lienzo ---------- */
const pt=e=>{const r=cv.getBoundingClientRect();if(isInf())return{x:cam.x+(e.clientX-r.left)/zoomK,y:cam.y+(e.clientY-r.top)/zoomK};return{x:(e.clientX-r.left)*doc.W/r.width,y:(e.clientY-r.top)*doc.H/r.height}};
function toLocal(o,p){const cx=o.x+o.w/2,cy=o.y+o.h/2,dx=p.x-cx,dy=p.y-cy,ca=Math.cos(-(o.rot||0)),sa=Math.sin(-(o.rot||0));return{x:dx*ca-dy*sa,y:dx*sa+dy*ca}}
const hit=(o,p)=>{const l=toLocal(o,p);return Math.abs(l.x)<=Math.max(o.w,14)/2&&Math.abs(l.y)<=Math.max(o.h,14)/2};
function handleAt(p){if(S.length!==1||S[0].lock)return-1;const k=1/zoomK,c=corners(S[0]);for(let i=4;i>=0;i--)if(Math.hypot(p.x-c[i].x,p.y-c[i].y)<=12*k)return i;return-1}
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0&&!(e.button===1&&isInf()))return;cv.setPointerCapture(e.pointerId);
  if(isInf()&&(e.button===1||spaceDown||tool==='hand')){e.preventDefault();drag={mode:'pan',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};cv.style.cursor='grabbing';return}
  const p=pt(e),O=pg().objs;
  if(tool==='pen'||tool==='hl'){startStroke(p);return}
  if(tool==='er'){drag={mode:'erase'};eraseAt(p);return}
  const h=handleAt(p);if(h>=0){drag={mode:h===4?'rot':'res',h,o:Object.assign({},S[0])};return}
  let t=null;for(let i=O.length-1;i>=0;i--)if(hit(O[i],p)){t=O[i];break}
  if(t){
    if(e.shiftKey)S=S.includes(t)?S.filter(x=>x!==t):[...S,t];else if(!S.includes(t))S=[t];
    drag={mode:'move',sx:p.x,sy:p.y,orig:S.map(o=>[o,o.x,o.y]),moved:false};
  }else{if(!e.shiftKey)S=[];drag={mode:'marq',base:S.slice()};marq={x1:p.x,y1:p.y,x2:p.x,y2:p.y}}
  buildProps();draw();
});
cv.addEventListener('pointermove',e=>{
  const p=pt(e);
  if(!drag){if(tool==='sel'){const h=handleAt(p);cv.style.cursor=h===4?'grab':h>=0?'nwse-resize':pg().objs.some(o=>hit(o,p))?'move':'default'}return}
  if(drag.mode==='pan'){cam.x=drag.cx-(e.clientX-drag.sx)/zoomK;cam.y=drag.cy-(e.clientY-drag.sy)/zoomK;draw();return}
  if(drag.mode==='stroke'){const l=drag.o.pts[drag.o.pts.length-1];if(Math.hypot(p.x-l[0],p.y-l[1])>1.5/zoomK){drag.o.pts.push([p.x,p.y]);draw()}return}
  if(drag.mode==='erase'){eraseAt(p);return}
  if(drag.mode==='marq'){
    marq.x2=p.x;marq.y2=p.y;const x1=Math.min(marq.x1,marq.x2),x2=Math.max(marq.x1,marq.x2),y1=Math.min(marq.y1,marq.y2),y2=Math.max(marq.y1,marq.y2);
    const inside=pg().objs.filter(o=>{const b=bboxOf(o);return b.x2>=x1&&b.x1<=x2&&b.y2>=y1&&b.y1<=y2});
    S=[...new Set([...drag.base,...inside])];draw();return;
  }
  if(drag.mode==='move'){
    let dx=p.x-drag.sx,dy=p.y-drag.sy;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;if(!drag.moved)return;
    guides=[];
    if($('#gSnap').checked&&!e.altKey){
      const xs=drag.orig.map(([o,x])=>[x,x+o.w]).flat(),ys=drag.orig.map(([o,,y])=>[y,y+o.h]).flat();
      const x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys),thr=8/zoomK;
      const cx=isInf()?[]:[0,doc.W/2,doc.W],cy=isInf()?[]:[0,doc.H/2,doc.H];
      pg().objs.forEach(o=>{if(!S.includes(o)){cx.push(o.x,o.x+o.w/2,o.x+o.w);cy.push(o.y,o.y+o.h/2,o.y+o.h)}});
      let bx=null,by=null;
      [x1+dx,(x1+x2)/2+dx,x2+dx].forEach(v=>cx.forEach(c=>{const d=c-v;if(Math.abs(d)<thr&&(bx===null||Math.abs(d)<Math.abs(bx.d)))bx={d,c}}));
      [y1+dy,(y1+y2)/2+dy,y2+dy].forEach(v=>cy.forEach(c=>{const d=c-v;if(Math.abs(d)<thr&&(by===null||Math.abs(d)<Math.abs(by.d)))by={d,c}}));
      if(bx){dx+=bx.d;guides.push({x:bx.c})}if(by){dy+=by.d;guides.push({y:by.c})}
    }
    drag.orig.forEach(([o,x,y])=>{if(!o.lock){o.x=x+dx;o.y=y+dy}});syncProps();draw();return;
  }
  const s=S[0];
  if(drag.mode==='rot'){const cx=s.x+s.w/2,cy=s.y+s.h/2;let a=Math.atan2(p.y-cy,p.x-cx)+Math.PI/2;if(e.shiftKey)a=Math.round(a/(Math.PI/12))*Math.PI/12;s.rot=a}
  else{
    const o=drag.o,sx=[-1,1,1,-1][drag.h],sy=[-1,-1,1,1][drag.h],L=toLocal(o,p),opx=-sx*o.w/2,opy=-sy*o.h/2;

    if(o.type==='line')nh=o.h;
    const ccx=opx+sx*nw/2,ccy=opy+sy*nh/2,ca=Math.cos(o.rot||0),sa=Math.sin(o.rot||0);
    const wx=o.x+o.w/2+ccx*ca-ccy*sa,wy=o.y+o.h/2+ccx*sa+ccy*ca;
    s.w=nw;s.h=nh;s.x=wx-nw/2;s.y=wy-nh/2;if(o.type==='text')s.fs=Math.max(6,Math.round(o.fs*nw/o.w));
  }
  syncProps();draw();
});

const rng=(l,p,v,k,min,max,step=1)=>`<div class="row"><label>${l}</label><input type="range" data-p="${p}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${+(+v/k).toFixed(2)}"></div>`;
const col=(l,p,v)=>`<div class="row"><label>${l}</label><input type="color" data-p="${p}" data-c="1" value="${v}"></div>`;
function buildProps(){
  const P=$('#props');if(!doc)return;
  if(tool==='hand'){P.innerHTML='<div class="ptitle">Mano</div><p class="empty">Arrastra para mover la pizarra. También puedes desplazarte con la rueda del ratón, con la barra espaciadora o con el botón central.</p>';return}
  if(tool!=='sel'){P.innerHTML=`<div class="ptitle">${TOOLNAME[tool]}</div><p class="empty">Dibuja directamente sobre la página. Cada trazo es un objeto: después puedes moverlo, rotarlo, cambiar su tamaño o color con la herramienta <b>Mover</b>.<br><br>La <b>goma</b> borra trazos completos al pasar por encima.</p>`;return}
  if(!S.length){pageProps(P);return}
  const o=S[S.length-1],multi=S.length>1,isText=o.type==='text',img=o.type==='image',path=o.type==='path',line=o.type==='line';
  const shape=!isText&&!img&&!path&&!line,canText=isText||shape;
  let h=`<div class="ptitle">${multi?S.length+' elementos':NAMES[o.type]||o.type}${o.lock?' 🔒':''}</div>`;
  if(multi)h+=`<h3>Alinear</h3><div class="grid3"><button data-act="al-l">⇤ Izq.</button><button data-act="al-c">↔ Centro</button><button data-act="al-r">⇥ Der.</button><button data-act="al-t">⤒ Arriba</button><button data-act="al-m">↕ Medio</button><button data-act="al-b">⤓ Abajo</button></div><div class="grid2"><button data-act="dist-h">Distribuir H</button><button data-act="dist-v">Distribuir V</button></div>`;
  if(canText){
    h+=`<h3>Texto</h3>`;
    if(!multi)h+=`<textarea id="ptext" data-p="text" data-t="s" placeholder="${isText?'':'Texto dentro de la forma…'}">${esc(o.text)}</textarea>`;
    h+=`<div class="row"><label>Fuente</label><select data-p="ff" data-t="s">${FONTS.map(f=>`<option ${f===o.ff?'selected':''}>${f}</option>`).join('')}</select></div>`;
    h+=num('Tamaño','fs',o.fs,1,4,900);

    h+=`<div class="grid3">${['left','center','right'].map(a=>`<button class="${o.al===a?'on':''}" data-al="${a}">${{left:'⬅ Izq.',center:'↔ Centro',right:'➡ Der.'}[a]}</button>`).join('')}</div>`;
    h+=col('Color texto','tc',o.tc)+rng('Interlineado','lh',o.lh,1,.8,2.6,.05)+rng('Espaciado','ls',o.ls,1,-3,40,.5);

  if(shape||line){
    h+=`<h3>Relleno</h3>`+col('Color','fill',o.fill);
    h+=`<div class="row"><label>Degradado</label><button class="${o.g2?'on':''}" data-tg="grad" style="flex:1">${o.g2?'Activo':'Activar'}</button></div>`;
    if(o.g2)h+=col('Color 2','g2',o.g2)+num('Ángulo °','ga',o.ga,1,0,360);
    h+=`<div class="sw">${PALETTE.map(c=>`<i data-sw="${c}" style="background:${c}"></i>`).join('')}</div>`;
  }
  if(path)h+=`<h3>Trazo</h3>`+col('Color','stroke',o.stroke)+rng('Grosor','sw',o.sw,1,1,80)+`<div class="sw">${PALETTE.map(c=>`<i data-sw="${c}" style="background:${c}"></i>`).join('')}</div>`;
  if(!path&&!line)h+=`<h3>Borde</h3>`+col(isText?'Contorno':'Color','stroke',o.stroke)+rng('Grosor','sw',o.sw,1,0,40)+(isText?'':`<div class="row"><label>Estilo</label><select data-p="dash" data-t="n"><option value="0" ${o.dash==0?'selected':''}>Sólido</option><option value="1" ${o.dash==1?'selected':''}>Guiones</option><option value="2" ${o.dash==2?'selected':''}>Puntos</option></select></div>`);
  if(shape||img||line)h+=rng('Redondeo','r',o.r,1,0,Math.round(Math.min(o.w,o.h)/2)||1);
  if(img)h+=`<h3>Filtros de imagen</h3>`+rng('Brillo','br',o.br??100,1,0,200)+rng('Contraste','co',o.co??100,1,0,200)+rng('Saturación','sa',o.sa??100,1,0,300)+rng('B/N','gr',o.gr||0,1,0,100)+rng('Sepia','se',o.se||0,1,0,100)+rng('Desenfoque','bl',o.bl||0,1,0,20)+`<button data-act="resetf" style="width:100%">Restablecer filtros</button>`;
  h+=`<h3>Efectos</h3>`+rng('Opacidad','op',o.op,.01,0,100)+`<div class="row"><label>Sombra</label><button class="${o.sh?'on':''}" data-tg="sh" style="flex:1">${o.sh?'Activa':'Activar'}</button></div>`;
  if(o.sh)h+=rng('Difuminado','shb',o.shb,1,0,100)+rng('Distancia','shy',o.shy,1,-60,60)+col('Color','shc',o.shc);
  h+=`<h3>Transformar</h3>`+num('Rotación °','rot',o.rot,Math.PI/180,-360,360);
  if(!multi)h+=`<div class="grid2">${num('X','x',o.x)}${num('Y','y',o.y)}</div><div class="grid2">${num('Ancho','w',o.w)}${num('Alto','h',o.h)}</div>`;
  h+=`<div class="grid3"><button class="${o.fx?'on':''}" data-tg="fx">⇋ Espejo H</button><button class="${o.fy?'on':''}" data-tg="fy">⇅ Espejo V</button><button class="${o.lock?'on':''}" data-tg="lock">🔒 Bloquear</button></div>`;
  h+=`<h3>Capas y acciones</h3><div class="grid2"><button data-act="front">⬆ Al frente</button><button data-act="back">⬇ Al fondo</button><button data-act="fwd">↑ Subir</button><button data-act="bwd">↓ Bajar</button><button data-act="cx">↔ Centrar H</button><button data-act="cy">↕ Centrar V</button><button data-act="dup">⧉ Duplicar</button><button data-act="del" style="color:#e03">🗑 Borrar</button></div>`;
  P.innerHTML=h;
}
function pageProps(P){
  const p=pg(),b=p.bg,th=p.tpl>=0?THEMES[p.tpl]:null,word=doc.fmt.cat==='slide'?'diapositiva':'página';
  let h=`<div class="ptitle">${isInf()?'Pizarra infinita':'Página '+(doc.cur+1)+' de '+doc.pages.length}</div><p class="empty" style="margin:0 0 6px">Selecciona un elemento para editarlo o añade uno desde la barra izquierda.</p>`;
  h+=`<h3>Fondo</h3><div class="row"><label>Color</label><input type="color" data-b="c1" value="${b.c1}"></div>`;
  h+=`<div class="row"><label>Degradado</label><button class="${b.c2?'on':''}" data-bt="grad" style="flex:1">${b.c2?'Activo':'Activar'}</button></div>`;
  if(b.c2)h+=`<div class="row"><label>Color 2</label><input type="color" data-b="c2" value="${b.c2}"></div><div class="row"><label>Ángulo °</label><input type="number" data-b="ang" data-n="1" value="${b.ang||0}"></div>`;
  h+=`<div class="row"><label>Patrón</label><select data-b="pat"><option value="" ${!b.pat?'selected':''}>Ninguno</option><option value="dots" ${b.pat==='dots'?'selected':''}>Puntos</option><option value="lines" ${b.pat==='lines'?'selected':''}>Renglones</option><option value="grid" ${b.pat==='grid'?'selected':''}>Cuadrícula</option></select></div>`;

  if(doc.fmt.cat==='board'||doc.fmt.cat==='draw')h+=`<h3>Consejo</h3><p class="empty">Usa <b>Nota</b> para añadir notas adhesivas y <b>Lápiz</b> para dibujar a mano alzada.</p>`;

$('#props').addEventListener('click',e=>{
  const t=e.target;
  const tg=t.closest('[data-tg]');
  if(tg){const p=tg.dataset.tg;
    if(p==='grad')S.forEach(o=>o.g2=o.g2?null:'#00c4cc');

    draw();buildProps();commit();return}
  const al=t.closest('[data-al]');if(al){S.forEach(o=>o.al=al.dataset.al);draw();buildProps();commit();return}

  const a=t.closest('[data-act]');if(a){act(a.dataset.act);return}
  const bt=t.closest('[data-bt]');if(bt){const b=pg().bg;b.c2=b.c2?null:'#00c4cc';draw();buildProps();commit();return}
  if(t.id==='pResize'){changeFormat(Object.assign({},doc.fmt,{id:'custom',name:'Personalizado'}),clamp(+$('#pw').value||doc.W,100,8000),clamp(+$('#ph').value||doc.H,100,8000))}
});
function act(n){
  const O=pg().objs;
  if(n==='retpl'){const p=pg();Object.assign(p,genPage(p.tpl,normKind(doc.fmt.cat,p.kind),doc.W,doc.H,doc.fmt,p.lay));S=[];refreshAll();draw();commit();return}
  if(!S.length)return;
  const o=S[S.length-1];
  if(n==='del'){pg().objs=O.filter(x=>!S.includes(x));S=[]}
  else if(n==='dup'){copySel();pasteClip()}
  else if(n==='front'){S.forEach(x=>{O.splice(O.indexOf(x),1);O.push(x)})}
  else if(n==='back'){[...S].reverse().forEach(x=>{O.splice(O.indexOf(x),1);O.unshift(x)})}
  else if(n==='fwd'){S.forEach(x=>{const i=O.indexOf(x);if(i<O.length-1){O.splice(i,1);O.splice(i+1,0,x)}})}
  else if(n==='bwd'){S.forEach(x=>{const i=O.indexOf(x);if(i>0){O.splice(i,1);O.splice(i-1,0,x)}})}
  else if(n==='cx'){const b=unionBox(S),w=b.x2-b.x1,d=(doc.W-w)/2-b.x1;S.forEach(x=>x.x+=d)}
  else if(n==='cy'){const b=unionBox(S),h=b.y2-b.y1,d=(doc.H-h)/2-b.y1;S.forEach(x=>x.y+=d)}
  else if(n==='case'){S.forEach(x=>{if(x.text!=null)x.text=x.text===x.text.toUpperCase()?x.text.toLowerCase():x.text.toUpperCase()})}
  else if(n==='resetf'){S.forEach(x=>{x.br=x.co=x.sa=100;x.gr=x.se=x.bl=0})}
  else if(n.startsWith('al-')){
    const ref=S.length>1?unionBox(S):{x1:0,y1:0,x2:doc.W,y2:doc.H};
    S.forEach(x=>{const w=x.w,h=x.h;
      if(n==='al-l')x.x=ref.x1;if(n==='al-r')x.x=ref.x2-w;if(n==='al-c')x.x=(ref.x1+ref.x2)/2-w/2;
      if(n==='al-t')x.y=ref.y1;if(n==='al-b')x.y=ref.y2-h;if(n==='al-m')x.y=(ref.y1+ref.y2)/2-h/2})}
  else if(n.startsWith('dist-')&&S.length>2){
    const h=n==='dist-h',s=[...S].sort((a,b)=>h?a.x-b.x:a.y-b.y),a=h?s[0].x:s[0].y,last=s[s.length-1],b=h?last.x+last.w:last.y+last.h;
    const tot=s.reduce((q,x)=>q+(h?x.w:x.h),0),gap=(b-a-tot)/(s.length-1);let pos=a;
    s.forEach(x=>{if(h){x.x=pos;pos+=x.w+gap}else{x.y=pos;pos+=x.h+gap}})}
  draw();buildProps();commit();
}
function copySel(){if(S.length)clip=JSON.stringify(S.map(o=>JSON.parse(JSON.stringify(o))))}
function pasteClip(){if(!clip)return;const items=JSON.parse(clip);S=items.map(o=>{o.id=nextId++;o.x+=26;o.y+=26;pg().objs.push(o);return o});clip=JSON.stringify(items);draw();buildProps();commit()}

function buildStrip(){
  const el=$('#pages'),word=doc.fmt.cat==='slide'?'diapositiva':'página';
  el.hidden=!(doc.fmt.multi||doc.pages.length>1);if(el.hidden)return;
  el.innerHTML=`<div class="pops"><button id="pAdd" class="primary">＋ Nueva ${word}</button><button id="pDup">⧉ Duplicar</button><button id="pDel">🗑 Eliminar</button></div>`+doc.pages.map((p,i)=>`<div class="pth${i===doc.cur?' on':''}" draggable="true" data-i="${i}"><canvas></canvas><span>${i+1}</span></div>`).join('');
  $$('.pth canvas',el).forEach((c,i)=>{const p=doc.pages[i];renderPage(p,c,120/doc.W,doc.W,doc.H)});
  $('#pDel').disabled=doc.pages.length<2;
}
$('#pages').addEventListener('click',e=>{
  const th=e.target.closest('.pth');
  if(th){doc.cur=+th.dataset.i;S=[];buildStrip();draw();buildProps();return}
  if(e.target.id==='pAdd'){
    const p=pg(),n=p.tpl>=0&&doc.fmt.cat==='slide'?genPage(p.tpl,'content',doc.W,doc.H,doc.fmt,p.lay):{bg:Object.assign({},p.bg),objs:[],tpl:p.tpl,lay:p.lay,kind:p.kind};
    if(!n.sig)n.sig=sigOf(n);doc.pages.splice(doc.cur+1,0,n);doc.cur++;S=[];buildStrip();draw();buildProps();commit()}
  if(e.target.id==='pDup'){const c=JSON.parse(JSON.stringify(pg()));c.objs.forEach(o=>o.id=nextId++);doc.pages.splice(doc.cur+1,0,c);doc.cur++;S=[];buildStrip();draw();buildProps();commit()}
  if(e.target.id==='pDel'&&doc.pages.length>1){doc.pages.splice(doc.cur,1);doc.cur=Math.min(doc.cur,doc.pages.length-1);S=[];buildStrip();draw();buildProps();commit()}
});

$('#pages').addEventListener('dragover',e=>{e.preventDefault();$$('#pages .pth').forEach(x=>x.classList.remove('over'));const t=e.target.closest('.pth');if(t)t.classList.add('over')});

$('#expMenu').onclick=async e=>{

  const one=(p,k,type)=>{const bx=pageBox(p),c=document.createElement('canvas');renderPage(p,c,Math.min(k,6000/Math.max(bx.w,bx.h)),bx.w,bx.h,bx.x,bx.y);return c.toDataURL(type==='jpg'?'image/jpeg':'image/png',.93)};

  else if(x==='png2')download(one(pg(),2,'png'),nm+'@2x.png');
  else if(x==='jpg')download(one(pg(),1,'jpg'),nm+'.jpg');
  else if(x==='allpng'){for(let i=0;i<doc.pages.length;i++){download(one(doc.pages[i],1,'png'),`${nm}-${i+1}.png`);await new Promise(r=>setTimeout(r,350))}}
  else if(x==='pdf'){toast('Generando PDF…',1500);await new Promise(r=>setTimeout(r,30));await exportPDF(nm)}
};
async function exportPDF(nm){
  const imgs=[];
  for(const p of doc.pages){
    const bx=pageBox(p),k=Math.min(2,3000/Math.max(bx.w,bx.h)),c=document.createElement('canvas');renderPage(p,c,k,bx.w,bx.h,bx.x,bx.y);
    const b=atob(c.toDataURL('image/jpeg',.92).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    imgs.push({w:c.width,h:c.height,pw:(bx.w*.75).toFixed(2),ph:(bx.h*.75).toFixed(2),d:u});await new Promise(r=>setTimeout(r));
  }
  const enc=new TextEncoder(),parts=[],off=[];let pos=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);pos+=b.length};
  const obj=(n,body)=>{off[n]=pos;push(`${n} 0 obj\n${body}\nendobj\n`)};
  const N=2+imgs.length*3;
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Count ${imgs.length} /Kids [${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] >>`);
  imgs.forEach((im,i)=>{
    const pw=im.pw,ph=im.ph,pn=3+i*3,cn=pn+1,xn=pn+2,cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(pn,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${xn} 0 R >> >> /Contents ${cn} 0 R >>`);
    obj(cn,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    off[xn]=pos;push(`${xn} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.d.length} >>\nstream\n`);push(im.d);push('\nendstream\nendobj\n');
  });
  const xr=pos;let x=`xref\n0 ${N+1}\n0000000000 65535 f \n`;for(let n=1;n<=N;n++)x+=String(off[n]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${N+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  dlBlob(new Blob(parts,{type:'application/pdf'}),nm+'.pdf');toast('PDF descargado');
}

document.addEventListener('keydown',e=>{

}
$('#stabs').addEventListener('click',e=>{
  if(e.target.id==='tAdd'){SH.sheets.push(mkSheet('Hoja '+(SH.sheets.length+1)));SH.cur=SH.sheets.length-1;buildGrid();buildTabs();selectCell(0,0);shCommit();return}
  if(e.target.id==='tDel'){if(SH.sheets.length>1&&confirm('¿Eliminar esta hoja?')){SH.sheets.splice(SH.cur,1);SH.cur=0;buildGrid();buildTabs();selectCell(0,0);shCommit()}return}
  const b=e.target.closest('[data-i]');if(b){SH.cur=+b.dataset.i;buildGrid();buildTabs();selectCell(0,0)}
});
$('#stabs').addEventListener('dblclick',e=>{const b=e.target.closest('[data-i]');if(!b)return;const n=prompt('Nombre de la hoja:',SH.sheets[+b.dataset.i].name);if(n){SH.sheets[+b.dataset.i].name=n;buildTabs();shCommit()}});
function usedRange(){const s=cur();let mr=0,mc=0;for(const id in s.cells){const m=id.match(/([A-Z]+)(\d+)/),c=m[1].charCodeAt(0)-65,r=+m[2]-1;if((s.cells[id].v||'')!==''){mr=Math.max(mr,r);mc=Math.max(mc,c)}}return{mr,mc}}
$('#sCsv').onclick=()=>{
  cache.clear();const{mr,mc}=usedRange(),rows=[];
  for(let r=0;r<=mr;r++){const row=[];for(let c=0;c<=mc;c++){const id=idOf(r,c),cell=cur().cells[id];let v=cell&&cell.v!==''?fmtVal(getVal(id,[])):'';if(/[",;\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';row.push(v)}rows.push(row.join(';'))}
  dlBlob(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}),safeName(SH.name)+'.csv');toast('CSV descargado (separado por «;», abre bien en Excel en español)');
};
$('#sXls').onclick=()=>{
  cache.clear();const{mr,mc}=usedRange();let h='<html><head><meta charset="utf-8"></head><body><table border="1">';
  for(let r=0;r<=mr;r++){h+='<tr>';for(let c=0;c<=mc;c++){const id=idOf(r,c),cell=cur().cells[id]||{},v=cell.v!==undefined&&cell.v!==''?fmtVal(getVal(id,[])):'';h+=`<td style="${cell.b?'font-weight:bold;':''}${cell.i?'font-style:italic;':''}${cell.bg?'background:'+cell.bg+';':''}${cell.fc?'color:'+cell.fc+';':''}">${esc(v)}</td>`}h+='</tr>'}
  dlBlob(new Blob([h+'</table></body></html>'],{type:'application/vnd.ms-excel'}),safeName(SH.name)+'.xls');
};
$('#sSave').onclick=()=>{dlBlob(new Blob([JSON.stringify(SH)],{type:'application/json'}),safeName(SH.name)+'.atelier.json');toast('Hoja guardada')};

/* ================= INICIO ================= */
renderHome();
})();
</script>
</body>
</html>
