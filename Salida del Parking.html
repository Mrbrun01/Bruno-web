<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Salida del Parking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: pantalla única de juego móvil. Cabecera con el selector de nivel, el garaje en canvas ocupa el resto y los controles van abajo. */
:root {
  --bg: #12141f;
  --panel: #1d2132;
  --line: #333952;
  --fg: #eef0f7;
  --muted: #9aa2bd;
  --accent: #ffc21a;
  --accent-ink: #1c1300;
  --good: #4cdf8a;
  --focus: #8fd3ff;
  --font-display: "Silkscreen", "Courier New", ui-monospace, monospace;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 14px;
}
.app {
  height: 100%;
  min-height: 540px;
  max-width: 600px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.6rem;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-transform: uppercase;
}
.levelnav { display: flex; align-items: center; gap: 6px; }
.levelname { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; min-width: 7.5ch; text-align: center; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: grid; gap: 0; min-width: 0; }
.stat-label { font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stat-value { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; font-variant-numeric: tabular-nums; }

.stage { position: relative; flex: 1 1 auto; min-height: 260px; min-width: 0; }
canvas {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
canvas.dragging { cursor: grabbing; }
canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

.status { margin: 0; min-height: 2.8em; color: var(--muted); font-size: 0.9rem; }
.status strong { color: var(--fg); font-weight: 800; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls button:not(.primary) { flex: 1 1 0; }
button {
  font: inherit;
  color: var(--fg);
  min-height: 44px;
  padding: 8px 14px;
  border: 2px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: 0.35; cursor: default; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: #d99e00; font-weight: 700; flex: 1 1 100%; }
button.primary:hover:not(:disabled) { border-color: var(--fg); }
button.step { width: 40px; min-height: 40px; padding: 0; font-size: 1.1rem; line-height: 1; }

.loading {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
  padding: 10px 16px; border-radius: 8px; background: var(--panel); border: 2px solid var(--line);
  font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
}
.loading[hidden] { display: none; }
.help { margin: 0; color: var(--muted); font-size: 0.8rem; }
kbd {
  font-family: var(--font-display); font-size: 0.65rem; padding: 1px 5px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; background: var(--panel); color: var(--fg);
}
</style>

<main class="app">
  <header>
    <h1>Parking</h1>
    <div class="levelnav">
      <button class="step" id="prev" type="button" aria-label="Nivel anterior">&lsaquo;</button>
      <span class="levelname" id="levelname" aria-live="polite">Nivel 1</span>
      <button class="step" id="next" type="button" aria-label="Nivel siguiente">&rsaquo;</button>
    </div>
  </header>

  <section class="stats" aria-label="Estado de la partida">
    <div class="stat"><span class="stat-label">Movimientos</span><span class="stat-value" id="moves">0</span></div>
    <div class="stat"><span class="stat-label">Par</span><span class="stat-value" id="par">0</span></div>
  </section>

  <section class="stage" id="stage">
    <canvas id="board" tabindex="0" role="img" aria-label="Garaje con coches. Arrastra un coche por su eje, o toca uno y usa las flechas del teclado. El coche rojo debe salir por la derecha."></canvas>
    <div class="loading" id="loading" hidden>Generando nivel…</div>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="controls">
    <button id="nextLevel" class="primary" type="button" hidden>Siguiente nivel</button>
    <button id="undo" type="button">Deshacer</button>
    <button id="restart" type="button">Reiniciar</button>
    <button id="hint" type="button">Pista</button>
  </div>
  <p class="help">Arrastra un coche por su eje, o toca uno y usa <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd>. <kbd>C</kbd> cambia de coche, <kbd>Z</kbd> deshace, <kbd>R</kbd> reinicia, <kbd>H</kbd> da una pista.</p>
</main>

//#CORE-START
// Búsqueda en anchura: devuelve los movimientos mínimos hasta que el coche rojo llega a la puerta
// (d), y el primer movimiento de una solución óptima. cs es una lista de [orientación, largo, fila o columna, posición].
function bfsSolve(n, cs, cap) {
  var gate = n - 2, m = cs.length;
  var mult = new Array(m), k0 = 0, i, j, k;
  for (i = m - 1, k = 1; i >= 0; i--, k *= n) mult[i] = k;
  for (i = 0; i < m; i++) k0 += cs[i][3] * mult[i];
  var keys = [k0], par = [-1], mvI = [-1], mvTo = [-1], dep = [0];
  var seen = new Map(); seen.set(k0, 0);
  var p = new Array(m), g = new Uint8Array(n * n);
  for (var qi = 0; qi < keys.length; qi++) {
    var key = keys[qi], t = key;
    for (i = m - 1; i >= 0; i--) { p[i] = t % n; t = (t - p[i]) / n; }
    if (p[0] === gate) {
      var idx = qi, first = -1;
      while (par[idx] !== -1) { first = idx; idx = par[idx]; }
      return { d: dep[qi], i: first < 0 ? -1 : mvI[first], to: first < 0 ? -1 : mvTo[first] };
    }
    g.fill(0);
    for (i = 0; i < m; i++) {
      var o = cs[i][0], f = cs[i][2];
      for (k = 0; k < cs[i][1]; k++) g[o === "h" ? f * n + p[i] + k : (p[i] + k) * n + f] = 1;
    }
    for (j = 0; j < m; j++) {
      var c = cs[j], horiz = c[0] === "h", len = c[1], fx = c[2];
      for (var dir = -1; dir <= 1; dir += 2) {
        var x = p[j];
        for (;;) {
          var edge = dir < 0 ? x - 1 : x + len;
          if (edge < 0 || edge >= n) break;
          if (g[horiz ? fx * n + edge : edge * n + fx]) break;
          x += dir;
          var nk = key + (x - p[j]) * mult[j];
          if (!seen.has(nk)) {
            seen.set(nk, keys.length);
            keys.push(nk); par.push(qi); mvI.push(j); mvTo.push(x); dep.push(dep[qi] + 1);
          }
        }
      }
    }
    if (keys.length > cap) return null;
  }
  return null;
}

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const canvas = $("board");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const STORE_KEY = "parking.v1";
  const FONT = '"Silkscreen", "Courier New", monospace';

    ["#8a5be0", "morado"], ["#f08a2a", "naranja"], ["#1fb5c9", "turquesa"], ["#e866a8", "rosa"],
    ["#c7cfdb", "plata"], ["#9a6a45", "marrón"], ["#9acd32", "lima"], ["#f4f6fa", "blanco"],
    ["#6cc3ff", "celeste"], ["#8d2b4a", "granate"], ["#2d7a64", "verde oscuro"], ["#ff7f6e", "coral"]
  ];
  function hexRgb(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
  function mix(h, o, t) {
    const a = hexRgb(h), b = o === "w" ? [255, 255, 255] : [0, 0, 0];
    return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")";
  }
  PALETTE.forEach((p) => {
    p.hi = mix(p[0], "w", 0.3); p.base = p[0]; p.lo = mix(p[0], "k", 0.34);
    p.roof = mix(p[0], "w", 0.16); p.box = mix(p[0], "w", 0.26);
  });

  // ---------- persistencia ----------
  let store = { level: 1, max: 1, best: {} };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && typeof raw === "object") {
      store.max = Math.max(1, raw.max | 0);
      store.level = Math.min(store.max, Math.max(1, raw.level | 0));
      if (raw.best && typeof raw.best === "object") store.best = raw.best;
    }
  } catch (e) { /* sin almacenamiento */ }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignorar */ } }

  // ---------- generación en segundo plano ----------
  const cache = new Map();
  const pending = new Map();
  let worker = null, reqId = 0;
  function startWorker() {
    try {
      const src = "var LIB=" + JSON.stringify(LIB) + ";" + bfsSolve.toString() + ";" + bfsDist.toString() + ";" + boardSize.toString() + ";" + genCore.toString() +
        ";self.onmessage=function(e){self.postMessage({id:e.data.id,level:genCore(e.data.L)});};";
      const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
      worker = new Worker(url);
      worker.onmessage = (e) => { const cb = pending.get(e.data.id); pending.delete(e.data.id); if (cb) cb(e.data.level); };
      worker.onerror = () => { worker = null; };
    } catch (err) { worker = null; }
  }

  function getLevel(L, cb) {
    if (cache.has(L)) { cb(cache.get(L)); return; }

      pending.set(id, done);

  function loadLevel(L) {

    const token = ++st.token;
    st.level = L; st.loading = !cache.has(L);

      $("loading").hidden = true;

    st.won = false; st.wonAt = 0; st.hint = null; drag = null;
    layout();

  function occupancy(skip) {
    const n = st.lv.n, g = new Uint8Array(n * n);
    for (const c of st.cars) {
      if (c.i === skip) continue;
      for (let k = 0; k < c.l; k++) g[c.o === "h" ? c.f * n + c.p + k : (c.p + k) * n + c.f] = 1;
    }
    return g;
  }
  function range(c) {
    const n = st.lv.n, g = occupancy(c.i);
    const at = (x) => g[c.o === "h" ? c.f * n + x : x * n + c.f];
    let lo = c.p, hi = c.p;
    while (lo - 1 >= 0 && !at(lo - 1)) lo--;
    while (hi + c.l < n && !at(hi + c.l)) hi++;
    return [lo, hi];
  }
  function commit(c, from, to) {
    if (from === to) return;
    const counted = st.lastMoved !== c.i;
    if (counted) st.moves++;
    st.history.push({ i: c.i, from, to, counted });
    st.lastMoved = c.i;
    st.hint = null;
    updateUI();
    if (st.cars[0].p === st.lv.n - 2) win();
    else setStatus("Despeja el camino hasta la salida.");
    kick();
  }
  function undo() {
    if (st.won || st.loading || !st.history.length) return;
    const h = st.history.pop(), c = st.cars[h.i];
    c.p = h.from;
    if (h.counted) st.moves--;
    st.lastMoved = st.history.length ? st.history[st.history.length - 1].i : -1;
    st.hint = null; st.sel = h.i;
    updateUI(); setStatus("Movimiento deshecho."); kick();
  }
  function restart() {
    if (!st.lv || st.loading) return;
    begin(st.lv);
    setStatus("Nivel reiniciado.");
  }
  function win() {
    st.won = true; st.wonAt = performance.now(); st.hint = null;
    const L = st.level, par = st.lv.par;
    if (!store.best[L] || st.moves < store.best[L]) store.best[L] = st.moves;
    if (store.max < L + 1) store.max = L + 1;
    save();
    updateUI();
    const verdict = st.moves < par ? "Mejor que el par." : st.moves === par ? "Par exacto." : "El par era " + par + ". Puedes reintentarlo.";
    setStatus("<strong>¡Fuera! " + st.moves + (st.moves === 1 ? " movimiento." : " movimientos.") + "</strong> " + verdict, true);
    prefetch(L + 1);
    kick();
  }

  // ---------- pista ----------
  function hint() {
    if (st.won || st.loading || !st.lv) return;
    const spec = st.cars.map((c) => [c.o, c.l, c.f, c.p]);
    const r = bfsSolve(st.lv.n, spec, 400000);
    if (!r || r.i < 0) { setStatus("Desde aquí no veo salida. Deshaz algún movimiento."); return; }
    const c = st.cars[r.i], k = Math.abs(r.to - c.p);
    const dir = c.o === "h" ? (r.to > c.p ? "a la derecha" : "a la izquierda") : (r.to > c.p ? "hacia abajo" : "hacia arriba");
    st.hint = { i: r.i, to: r.to, until: performance.now() + 4200 };
    st.sel = r.i;
    setStatus("Pista: mueve el coche " + c.pal[1] + " " + k + (k === 1 ? " plaza " : " plazas ") + dir + ".");
    kick();
  }

  // ---------- interfaz ----------
  function setStatus(msg, html) {
    const el = $("status");
    if (html) el.innerHTML = msg; else el.textContent = msg;
  }
  function updateUI() {
    $("levelname").textContent = "Nivel " + st.level;
    $("moves").textContent = st.moves;
    $("par").textContent = st.lv && !st.loading ? st.lv.par : "-";
    $("prev").disabled = st.level <= 1;
    $("next").disabled = st.level >= store.max;
    $("hint").disabled = st.won || st.loading;
    $("undo").disabled = st.won || st.loading || !st.history.length;
    $("restart").disabled = st.loading || (!st.history.length && !st.won);
    $("nextLevel").hidden = !st.won;
  }
  function layout() {
    const lv = st.lv;
    if (!lv) return;
    const stage = $("stage");
    const aw = Math.max(200, stage.clientWidth), ah = Math.max(200, stage.clientHeight);
    cs = Math.floor(Math.min(aw / (lv.n + 1.74), ah / (lv.n + 0.84), 84));
    cs = Math.max(cs, 18);
    pad = Math.round(cs * 0.42);
    ext = Math.round(cs * 0.9);
    W = lv.n * cs + pad * 2 + ext;
    H = lv.n * cs + pad * 2;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    bg = document.createElement("canvas");
    bg.width = canvas.width; bg.height = canvas.height;
    const g = bg.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintBackground(g);
  }

  // ---------- dibujo ----------
  function hash2(x, y, s) {
    let h = Math.imul(x + 1, 374761393) ^ Math.imul(y + 1, 668265263) ^ Math.imul(s + 1, 2246822519);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w / 2, h / 2);
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function paintBackground(g) {
    const lv = st.lv, n = lv.n, er = lv.er;
    const bw = n * cs + pad * 2;
    // marco de hormigón
    let grad = g.createLinearGradient(0, 0, bw, bw);
    grad.addColorStop(0, "#515a70"); grad.addColorStop(1, "#303647");
    rr(g, 0, 0, bw, bw, cs * 0.26); g.fillStyle = grad; g.fill();
    g.strokeStyle = "rgba(255,255,255,0.14)"; g.lineWidth = 1.5;
    rr(g, 0.75, 0.75, bw - 1.5, bw - 1.5, cs * 0.26); g.stroke();
    // asfalto
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const px = pad + x * cs, py = pad + y * cs, hh = hash2(x, y, st.level);
      g.fillStyle = (x + y) % 2 ? "#2c3040" : "#303445";
      g.fillRect(px, py, cs, cs);
      for (let k = 0; k < 3; k++) {
        const v = hh >>> (k * 5);
        g.fillStyle = k === 1 ? "rgba(255,255,255,0.045)" : "rgba(0,0,0,0.16)";
        g.fillRect(px + ((v % 90) / 100) * cs, py + (((v >>> 3) % 90) / 100) * cs, cs * 0.05, cs * 0.05);
      }
    }
    // líneas de plaza
    g.strokeStyle = "rgba(255,255,255,0.1)"; g.lineWidth = 1;
    g.beginPath();
    for (let i = 1; i < n; i++) {
      g.moveTo(pad + i * cs, pad); g.lineTo(pad + i * cs, pad + n * cs);
      g.moveTo(pad, pad + i * cs); g.lineTo(pad + n * cs, pad + i * cs);
    }
    g.stroke();
    // carril de salida
    g.save();
    g.strokeStyle = "rgba(255,194,26,0.5)"; g.lineWidth = Math.max(2, cs * 0.05);
    g.setLineDash([cs * 0.22, cs * 0.18]);
    g.beginPath(); g.moveTo(pad, pad + er * cs + cs / 2); g.lineTo(pad + n * cs, pad + er * cs + cs / 2); g.stroke();
    g.restore();
    // sombra interior
    grad = g.createLinearGradient(0, pad, 0, pad + cs * 0.4);
    grad.addColorStop(0, "rgba(0,0,0,0.4)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(pad, pad, n * cs, cs * 0.4);
    grad = g.createLinearGradient(pad, 0, pad + cs * 0.3, 0);
    grad.addColorStop(0, "rgba(0,0,0,0.3)"); grad.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = grad; g.fillRect(pad, pad, cs * 0.3, n * cs);
    g.strokeStyle = "rgba(255,255,255,0.22)"; g.lineWidth = 2;
    g.strokeRect(pad - 1, pad - 1, n * cs + 2, n * cs + 2);
    // puerta de salida: abre el muro derecho y continúa la calzada
    const gx = pad + n * cs - 1, gy = pad + er * cs;
    g.fillStyle = "#2c3040"; g.fillRect(gx, gy, pad + ext + 1, cs);
    g.fillStyle = "rgba(0,0,0,0.25)"; g.fillRect(gx + pad, gy, ext, cs);
    g.fillStyle = "#6b7590"; g.fillRect(gx + pad, gy - 3, ext, 3); g.fillRect(gx + pad, gy + cs, ext, 3);
    g.fillStyle = "#515a70"; g.fillRect(gx, gy - 2, pad, 2); g.fillRect(gx, gy + cs, pad, 2);
    // luz y flechas verdes
    grad = g.createLinearGradient(gx, 0, W, 0);
    grad.addColorStop(0, "rgba(76,223,138,0.0)"); grad.addColorStop(1, "rgba(76,223,138,0.28)");
    g.fillStyle = grad; g.fillRect(gx, gy, W - gx, cs);
    g.save();
    g.strokeStyle = "#4cdf8a"; g.lineWidth = Math.max(2, cs * 0.07); g.lineCap = "round"; g.lineJoin = "round";
    g.shadowColor = "rgba(76,223,138,0.8)"; g.shadowBlur = cs * 0.2;
    const ax = gx + pad + ext * 0.18, ay = gy + cs / 2, s = cs * 0.14;
    for (let k = 0; k < 2; k++) {
      const x = ax + k * s * 1.7;
      g.beginPath(); g.moveTo(x, ay - s); g.lineTo(x + s, ay); g.lineTo(x, ay + s); g.stroke();
    }
    g.restore();
    // bolardos con franjas de aviso en las esquinas
    const bs = pad * 0.95;
    [[0, 0], [bw - bs, 0], [0, bw - bs], [bw - bs, bw - bs]].forEach(([x, y]) => {
      if (x > 0 && Math.abs(y + bs / 2 - (pad + er * cs + cs / 2)) < cs) return;
      g.save();
      rr(g, x + bs * 0.05, y + bs * 0.05, bs * 0.9, bs * 0.9, bs * 0.2); g.clip();
      g.fillStyle = "#ffc21a"; g.fillRect(x, y, bs, bs);
      g.fillStyle = "#1a1612";
      for (let k = -2; k < 6; k++) {
        g.beginPath();
        g.moveTo(x + k * bs * 0.35, y); g.lineTo(x + k * bs * 0.35 + bs * 0.17, y);
        g.lineTo(x + k * bs * 0.35 + bs * 0.17 + bs, y + bs); g.lineTo(x + k * bs * 0.35 + bs, y + bs);
        g.closePath(); g.fill();
      }
      g.restore();
    });
  }

  function drawCar(c, now) {
    const cxp = pad + (c.o === "h" ? c.vp + c.l / 2 : c.f + 0.5) * cs;
    const cyp = pad + (c.o === "h" ? c.f + 0.5 : c.vp + c.l / 2) * cs;
    const L = c.l * cs - cs * 0.16, Wd = cs * 0.74, x0 = -L / 2, y0 = -Wd / 2;
    const P = c.pal, hero = c.i === 0, truck = c.l === 3;
    ctx.save();
    ctx.translate(cxp, cyp);
    if (c.o === "v") ctx.rotate(Math.PI / 2);
    // ruedas
    ctx.fillStyle = "#0b0d13";
    const wl = cs * 0.26, wt = cs * 0.08;
    for (const t of truck ? [0.17, 0.83] : [0.21, 0.79]) for (const sgn of [-1, 1]) {
      rr(ctx, x0 + t * L - wl / 2, sgn * Wd / 2 - wt / 2, wl, wt, wt / 2); ctx.fill();
    }
    // carrocería
    ctx.shadowColor = hero ? "rgba(255,70,60,0.6)" : "rgba(0,0,0,0.55)";
    ctx.shadowBlur = hero ? cs * 0.28 : cs * 0.14;
    ctx.shadowOffsetY = hero ? 0 : cs * 0.05;
    let grad = ctx.createLinearGradient(0, y0, 0, y0 + Wd);
    grad.addColorStop(0, P.hi); grad.addColorStop(0.5, P.base); grad.addColorStop(1, P.lo);
    rr(ctx, x0, y0, L, Wd, Wd * 0.3); ctx.fillStyle = grad; ctx.fill();
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.lineWidth = 1;
    rr(ctx, x0 + 0.5, y0 + 0.5, L - 1, Wd - 1, Wd * 0.3); ctx.stroke();
    if (hero) {
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.fillRect(x0 + L * 0.04, -Wd * 0.13, L * 0.92, Wd * 0.07);
      ctx.fillRect(x0 + L * 0.04, Wd * 0.06, L * 0.92, Wd * 0.07);
    }
    const glass = () => {
      const gg = ctx.createLinearGradient(0, y0, 0, y0 + Wd);
      gg.addColorStop(0, "#27344d"); gg.addColorStop(1, "#0b101b");
      ctx.fillStyle = gg;
    };
    if (!truck) {
      glass(); rr(ctx, x0 + L * 0.16, y0 + Wd * 0.13, L * 0.56, Wd * 0.74, Wd * 0.18); ctx.fill();
      grad = ctx.createLinearGradient(0, y0, 0, y0 + Wd);
      grad.addColorStop(0, P.hi); grad.addColorStop(1, P.roof);
      ctx.fillStyle = grad;
      rr(ctx, x0 + L * 0.31, y0 + Wd * 0.22, L * 0.27, Wd * 0.56, Wd * 0.12); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.28)"; ctx.lineWidth = Math.max(1, cs * 0.025);
      ctx.beginPath(); ctx.moveTo(x0 + L * 0.62, y0 + Wd * 0.2); ctx.lineTo(x0 + L * 0.66, y0 + Wd * 0.45); ctx.stroke();
    } else {
      grad = ctx.createLinearGradient(0, y0, 0, y0 + Wd);
      grad.addColorStop(0, P.box); grad.addColorStop(1, P.roof);
      ctx.fillStyle = grad; rr(ctx, x0 + L * 0.04, y0 + Wd * 0.08, L * 0.56, Wd * 0.84, Wd * 0.1); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = Math.max(1, cs * 0.025);
      ctx.beginPath();
      for (let k = 1; k < 5; k++) { const x = x0 + L * (0.04 + 0.56 * k / 5); ctx.moveTo(x, y0 + Wd * 0.12); ctx.lineTo(x, y0 + Wd * 0.88); }
      ctx.stroke();
      glass(); rr(ctx, x0 + L * 0.65, y0 + Wd * 0.14, L * 0.19, Wd * 0.72, Wd * 0.12); ctx.fill();
    }
    // faros y luces traseras
    ctx.save();
    ctx.shadowColor = "rgba(255,244,170,0.9)"; ctx.shadowBlur = cs * 0.2;
    ctx.fillStyle = "#fff6c0";
    for (const y of [y0 + Wd * 0.1, y0 + Wd * 0.7]) { rr(ctx, x0 + L - cs * 0.1, y, cs * 0.07, Wd * 0.2, 2); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = "#ff4d4d";
    for (const y of [y0 + Wd * 0.1, y0 + Wd * 0.7]) { rr(ctx, x0 + cs * 0.03, y, cs * 0.06, Wd * 0.2, 2); ctx.fill(); }
    // selección y pista
    const hinted = st.hint && st.hint.i === c.i && now < st.hint.until;
    if (hinted) {
      ctx.strokeStyle = "rgba(255,194,26," + (0.55 + 0.45 * Math.sin(now / 110)).toFixed(2) + ")";
      ctx.lineWidth = Math.max(3, cs * 0.07);
      ctx.shadowColor = "rgba(255,194,26,0.9)"; ctx.shadowBlur = cs * 0.2;
      rr(ctx, x0 - 2, y0 - 2, L + 4, Wd + 4, Wd * 0.34); ctx.stroke();
    } else if (c.i === st.sel && !st.won) {
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = Math.max(2, cs * 0.04);
      rr(ctx, x0 - 2, y0 - 2, L + 4, Wd + 4, Wd * 0.34); ctx.stroke();
    }
    ctx.restore();
  }

  function drawGhost(now) {
    const h = st.hint, c = st.cars[h.i];
    const x = c.o === "h" ? h.to : c.f, y = c.o === "h" ? c.f : h.to;
    const w = c.o === "h" ? c.l : 1, hh = c.o === "h" ? 1 : c.l;
    ctx.save();
    ctx.setLineDash([cs * 0.14, cs * 0.1]);
    ctx.strokeStyle = "#ffc21a"; ctx.lineWidth = Math.max(2, cs * 0.05);
    ctx.fillStyle = "rgba(255,194,26,0.16)";
    rr(ctx, pad + x * cs + cs * 0.08, pad + y * cs + cs * 0.08, w * cs - cs * 0.16, hh * cs - cs * 0.16, cs * 0.2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function draw(now) {
    if (!st.lv || !bg) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0, W, H);
    if (st.hint && now < st.hint.until) drawGhost(now);
    const order = st.cars.slice().sort((a, b) => (drag && drag.car === a ? 1 : 0) - (drag && drag.car === b ? 1 : 0));
    ctx.save();
    for (const c of order) drawCar(c, now);
    ctx.restore();
    if (st.won) {
      const t = now - st.wonAt;
      if (t < 700) {
        ctx.fillStyle = "rgba(255,255,255," + (0.35 * (1 - t / 700)).toFixed(3) + ")";
        ctx.fillRect(0, 0, W, H);
      }
    }
  }

  // ---------- bucle ----------
  let raf = 0, last = 0;
  function loop(now) {
    raf = 0;
    const dt = Math.min(64, now - (last || now)); last = now;
    let live = false;
    for (const c of st.cars) {
      if (st.won && c.i === 0) {
        const t = Math.max(0, now - st.wonAt - 150) / 1000;
        c.vp = reduceMotion ? 20 : c.p + t * t * 9;
        if (c.vp < st.lv.n + 3) live = true;
        continue;
      }
      if (drag && drag.car === c) { live = true; continue; }
      const d = c.p - c.vp;
      if (Math.abs(d) > 0.002) {
        c.vp = reduceMotion ? c.p : c.vp + d * (1 - Math.exp(-dt / 55));
        live = true;
      } else c.vp = c.p;
    }
    draw(now);
    if (live || (st.hint && now < st.hint.until) || (st.won && now - st.wonAt < 800)) raf = requestAnimationFrame(loop);
    else last = 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  // ---------- entradas ----------
  function pointCell(e) {
    const r = canvas.getBoundingClientRect(), k = W / r.width;
    return [((e.clientX - r.left) * k - pad) / cs, ((e.clientY - r.top) * k - pad) / cs];
  }
  canvas.addEventListener("pointerdown", (e) => {
    if (st.won || st.loading || !st.lv) return;
    const [fx, fy] = pointCell(e);
    const car = st.cars.find((c) => c.o === "h"
      ? fx >= c.vp && fx <= c.vp + c.l && fy >= c.f && fy <= c.f + 1
      : fy >= c.vp && fy <= c.vp + c.l && fx >= c.f && fx <= c.f + 1);
    if (!car) return;
    st.sel = car.i; st.hint = null;
    drag = { car, p0: car.p, c0: car.o === "h" ? fx : fy, rng: range(car), id: e.pointerId };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignorar */ }
    canvas.classList.add("dragging");
    kick();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const [fx, fy] = pointCell(e);
    const v = drag.p0 + ((drag.car.o === "h" ? fx : fy) - drag.c0);
    drag.car.vp = Math.max(drag.rng[0], Math.min(drag.rng[1], v));
    kick();
  });
  function endDrag() {
    if (!drag) return;
    const c = drag.car, from = drag.p0, to = Math.round(c.vp);
    drag = null;
    canvas.classList.remove("dragging");
    c.p = to;
    commit(c, from, to);
    kick();
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  const KEYS = { ArrowUp: [1, -1], ArrowDown: [1, 1], ArrowLeft: [0, -1], ArrowRight: [0, 1], w: [1, -1], s: [1, 1], a: [0, -1], d: [0, 1] };
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k in KEYS) {
      e.preventDefault();
      if (st.won || st.loading || !st.lv) return;
      const c = st.cars[st.sel], axis = KEYS[k][0], dir = KEYS[k][1];
      if ((c.o === "h" ? 0 : 1) !== axis) return;
      const rg = range(c), np = c.p + dir;
      if (np < rg[0] || np > rg[1]) return;
      const from = c.p; c.p = np; commit(c, from, np);
    } else if (k === "r") restart();
    else if (k === "h") hint();
    else if (k === "z") undo();
    else if (k === "c" && st.lv && !st.won) { st.sel = (st.sel + 1) % st.cars.length; kick(); }
    else if (e.key === "Enter" && st.won) loadLevel(st.level + 1);
  });

  function goLevel(L) { loadLevel(Math.max(1, Math.min(L, store.max))); }
  $("prev").addEventListener("click", () => goLevel(st.level - 1));
  $("next").addEventListener("click", () => goLevel(st.level + 1));
  $("nextLevel").addEventListener("click", () => goLevel(st.level + 1));
  $("undo").addEventListener("click", undo);
  $("restart").addEventListener("click", restart);
  $("hint").addEventListener("click", hint);

  let lastW = 0, lastH = 0;
  new ResizeObserver(() => {
    const s = $("stage");
    if (s.clientWidth === lastW && s.clientHeight === lastH) return;
    lastW = s.clientWidth; lastH = s.clientHeight;
    layout(); kick();
  }).observe($("stage"));

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layout(); kick(); });
  loadLevel(store.level);
})();
</script>

</body></html>
